<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Kundenportal – Gleich wieder da</title>
<style>
:root{--grund:#EEF0F1;--flaeche:#FFFFFF;--linie:#DADEE1;--text:#171C1F;--text2:#2B3238;--text3:#5A646C;--kachel:#F3F5F6;--kachel-text:#4B555D}
@media (prefers-color-scheme: dark){:root{--grund:#121619;--flaeche:#1A2024;--linie:#2E373D;--text:#E9EDEF;--text2:#D5DBDF;--text3:#9DA8B0;--kachel:#222A2F;--kachel-text:#BAC3C9}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--grund);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--flaeche);border-bottom:1px solid var(--linie)}
.kopf{max-width:1040px;margin:0 auto;height:64px;padding:0 20px;display:flex;align-items:center;gap:10px}
.marke{display:inline-flex;border-radius:8px;background:#FFFFFF;padding:4px 3px}
.marke svg{width:30px;height:25px;display:block}
.name{font-size:14px;font-weight:700;letter-spacing:.04em}
main{flex:1;width:100%;max-width:440px;margin:0 auto;padding:40px 20px 24px;display:flex;flex-direction:column;gap:16px}
.kachel{width:56px;height:56px;border-radius:16px;background:var(--kachel);color:var(--kachel-text);display:inline-flex;align-items:center;justify-content:center}
.kachel svg{width:26px;height:26px}
h1{margin:0;font-size:26px;line-height:1.2;font-weight:700}
p{margin:0;font-size:16px;line-height:1.55;color:var(--text2)}
@media (min-width:900px){.kopf{height:72px;padding:0 24px}main{padding-top:48px}}
</style>
</head>
<body>
<!-- Kundenportal (seit 1.11.15, Stufe P1e; Bauplan P1, Abschnitt 5 E „Wartung“): die feste Seite, die nginx zeigt, solange der Portal-Dienst nicht antwortet
     (502/504, etwa beim Neustart durch update.sh). Kein Skript, nichts von außen, keine Schrift; der Stil steht hier und ist in der CSP von nginx über seine
     Prüfsumme erlaubt (scripts/server/nginx-kunde.conf, tests/test_v812_portal_wartung.py). Liegt auf dem Server unter /etc/nginx/dk-portal/wartung.html. -->
<header><div class="kopf"><span class="marke"><svg viewBox="240 47 1441 1184" aria-hidden="true" focusable="false"><polygon fill="#A7CD5D" points="240,402 972,47 972,316 240,670"/><polygon fill="#A7CD5D" points="240,962 972,607 972,877 240,1231"/><polygon fill="#367337" points="972,47 1681,390 1681,1220 972,877 972,607 1438,832 1438,542 972,316"/></svg></span><span class="name">Kundenportal</span></div></header>
<main>
<span class="kachel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 14a4 4 0 0 1 0-5.6l2.8-2.8a4 4 0 0 1 5.6 5.6l-1.4 1.4"/><path d="M14 10a4 4 0 0 1 0 5.6l-2.8 2.8a4 4 0 0 1-5.6-5.6l1.4-1.4"/></svg></span>
<h1>Gleich wieder da</h1>
<p>Das Kundenportal ist in wenigen Minuten wieder erreichbar.</p>
</main>
</body>
</html>

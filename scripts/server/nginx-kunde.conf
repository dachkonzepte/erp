# Kundenportal (seit 1.11.2, Stufe P1b) -- eigener server{} für kunde.dachkonzepte.gmbh. Einrichten: Server-Schritt S7 -- erst nur der Block für Port 80
# (Zertifikat mit certbot certonly --nginx -d kunde.dachkonzepte.gmbh), dann der Block für 443. Die Datei gehört nach /etc/nginx/conf.d/ (dort gelten
# limit_*_zone und log_format im http{}-Kontext). Danach: nginx -t, systemctl reload nginx.
#
# Kopfzeilen an den Dienst wie E4: X-Real-IP, X-Forwarded-For ($proxy_add_x_forwarded_for) und X-Forwarded-Proto; gunicorn vertraut ihnen nur von
# 127.0.0.1 und ::1 und nimmt die rechteste fremde Adresse -- eine vom Besucher vorangestellte Adresse hilft nicht.
# Protokoll (P1-8): Zugriffe ohne IP-Adresse und ohne Abfrage; Fehler ab „error“, die Meldungen der Begrenzung darunter -- sie trügen die Adresse ins
# Fehlerprotokoll. Die Schutz-Kopfzeilen setzt der Dienst selbst (an jeder Antwort, getestet) -- außer an den Dateien (internal-Block unten).
# Seit 1.11.34 (Stufe P2b) steht im Protokoll die angefragte Adresse ohne Abfrage ($dkportal_pfad aus $request_uri) statt $uri: nach X-Accel-Redirect wäre
# $uri der interne Weg mit dem Namen der Kopie -- der Name gehört nicht ins Protokoll (Bauplan P2, B2.1).
# Nur IPv4 (seit 1.11.20, Betreiberangabe 25.11.2026): nginx lauscht auf dem Server wie die übrigen Seiten nur auf 0.0.0.0, es gibt keine AAAA-Einträge --
# deshalb hier keine Adresse für IPv6. Bekommt der Server IPv6, kommen sie mit dem AAAA-Eintrag für kunde zusammen (tests/test_v815_nginx_nur_ipv4.py).

limit_req_zone $binary_remote_addr zone=dkportal_seiten:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=dkportal_code:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=dkportal_anschluss:10m;
map $request_uri $dkportal_pfad {
    "~^(?<pfad>[^?]*)" $pfad;
}
log_format dkportal '$time_iso8601 "$request_method $dkportal_pfad" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name kunde.dachkonzepte.gmbh;
    server_tokens off;
    access_log /var/log/nginx/kunde.access.log dkportal;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://kunde.dachkonzepte.gmbh$uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kunde.dachkonzepte.gmbh;
    ssl_certificate /etc/letsencrypt/live/kunde.dachkonzepte.gmbh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kunde.dachkonzepte.gmbh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/kunde.access.log dkportal;
    error_log /var/log/nginx/kunde.error.log error;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    limit_conn dkportal_anschluss 20;
    limit_conn_status 429;
    limit_conn_log_level notice;
    limit_req zone=dkportal_seiten burst=30 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;

    # seit 1.11.15 (Stufe P1e, Bauplan P1, Abschnitt 5 E „Wartung“): antwortet der Dienst nicht (502/504, etwa beim Neustart durch update.sh), die feste
    # Seite „Gleich wieder da“ -- ohne Skript, nichts von außen; ihr Stil ist in der CSP über seine Prüfsumme erlaubt (tests/test_v812_portal_wartung.py).
    # Antworten des Dienstes selbst (auch seine 503) gehen unverändert durch (proxy_intercept_errors bleibt aus). Die Datei kommt mit S7 auf den Server:
    #   sudo install -D -m 644 -o root -g root scripts/server/portal-wartung.html /etc/nginx/dk-portal/wartung.html
    error_page 502 504 /_wartung.html;
    location = /_wartung.html {
        internal;
        alias /etc/nginx/dk-portal/wartung.html;
        default_type text/html;
        charset utf-8;
        add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-qCPxKV+5392HTi9WWSYqcksnxlE4/lu/RkaO8XgezA4='; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Seit 1.11.34 (Stufe P2b; Bauplan P2, B2 „Weg B“, B6, Nachtrag 3): die Kopien der freigegebenen Unterlagen. Nur über X-Accel-Redirect des Dienstes
    # erreichbar (internal -- von außen 404); der Dienst nennt einen Namen nur für eine gültige Sitzung nach einer Anforderung. Ordner /srv/dk-portal/dateien
    # (tobias:www-data 2750, Dateien 0640: nginx liest über die Gruppe, dkportal gar nicht -- InaccessiblePaths in erp-portal.service).
    # Kopfzeilen: aus der Antwort des Dienstes übernimmt nginx bei X-Accel-Redirect nur Content-Type, Content-Disposition und Cache-Control (dazu Expires,
    # Accept-Ranges und Set-Cookie, die der Dienst hier nicht setzt) -- jede andere setzt dieser Block selbst, vollständig, auch HSTS (Nachtrag 3a; wer in
    # einer location add_header setzt, erbt keine). Die CSP ohne sandbox: sandbox verhindert in Chrome die Anzeige von PDFs (B6). Typen fest nach der Endung
    # der Kopie, sonst application/octet-stream (Nachtrag 3b). Ein Wächter vergleicht den Satz mit den Kopfzeilen des Dienstes (tests/test_v825_portal_dateien.py).
    location /_portal_dateien/ {
        internal;
        alias /srv/dk-portal/dateien/;
        types { application/pdf pdf; image/jpeg jpg; }
        default_type application/octet-stream;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /api/code {
        limit_req zone=dkportal_code burst=3 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}

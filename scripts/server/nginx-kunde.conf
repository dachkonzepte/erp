# Kundenportal (seit 1.11.2, Stufe P1b) -- eigener server{} für kunde.dachkonzepte.gmbh. Einrichten: Server-Schritt S7 -- erst nur der Block für Port 80
# (Zertifikat mit certbot certonly --nginx -d kunde.dachkonzepte.gmbh), dann der Block für 443. Die Datei gehört nach /etc/nginx/conf.d/ (dort gelten
# limit_*_zone und log_format im http{}-Kontext). Danach: nginx -t, systemctl reload nginx.
#
# Kopfzeilen an den Dienst wie E4: X-Real-IP, X-Forwarded-For ($proxy_add_x_forwarded_for) und X-Forwarded-Proto; gunicorn vertraut ihnen nur von
# 127.0.0.1 und ::1 und nimmt die rechteste fremde Adresse -- eine vom Besucher vorangestellte Adresse hilft nicht.
# Protokoll (P1-8): Zugriffe ohne IP-Adresse und ohne Abfrage ($uri statt $request); Fehler ab „error“, die Meldungen der Begrenzung darunter -- sie
# trügen die Adresse ins Fehlerprotokoll. Die Schutz-Kopfzeilen setzt der Dienst selbst (an jeder Antwort, getestet).

limit_req_zone $binary_remote_addr zone=dkportal_seiten:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=dkportal_code:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=dkportal_anschluss:10m;
log_format dkportal '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name kunde.dachkonzepte.gmbh;
    server_tokens off;
    access_log /var/log/nginx/kunde.access.log dkportal;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://kunde.dachkonzepte.gmbh$uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kunde.dachkonzepte.gmbh;
    ssl_certificate /etc/letsencrypt/live/kunde.dachkonzepte.gmbh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kunde.dachkonzepte.gmbh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/kunde.access.log dkportal;
    error_log /var/log/nginx/kunde.error.log error;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    limit_conn dkportal_anschluss 20;
    limit_conn_status 429;
    limit_conn_log_level notice;
    limit_req zone=dkportal_seiten burst=30 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;

    location = /api/code {
        limit_req zone=dkportal_code burst=3 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}

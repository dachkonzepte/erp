[alembic]
script_location = alembic
prepend_sys_path = .

# Hinweis: sqlalchemy.url wird bewusst NICHT hier gesetzt, sondern in
# alembic/env.py dynamisch aus app.database.DATABASE_URL uebernommen --
# dieselbe Umgebungsvariable (DATABASE_URL), die auch die App selbst nutzt.
# Damit gibt es nur eine Stelle, an der die Datenbankverbindung konfiguriert wird.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

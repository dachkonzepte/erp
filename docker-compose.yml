services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dachkonzepte_erp}
      POSTGRES_USER: ${POSTGRES_USER:-dachkonzepte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dachkonzepte}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

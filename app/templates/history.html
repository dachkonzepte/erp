<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DACHKONZEPTE ERP – Änderungshistorie</title><script>(function(){try{var t=localStorage.getItem('erp_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--accent:{{ get_theme().accent_color }};--bg:#f4f6f5;--card:#fff;--ink:#182420;--muted:#5c6f68;--line:#dde5e1;--field-border:#b9c4bd;--field-border-hover:#8fa098;--soft:#eef5f3;--sidebar-bg:#fbfdfc;--sidebar-text:#223028;--sidebar-text-dim:rgba(34,48,40,.7);--sidebar-border:#e2e8e5;--sidebar-hover:color-mix(in srgb,var(--accent) 8%,var(--sidebar-bg));--sidebar-active-bg:color-mix(in srgb,var(--accent) 12%,var(--sidebar-bg));--sidebar-active-text:var(--accent);--sidebar-active-border:var(--accent);color:var(--ink)}:root[data-theme="dark"]{color-scheme:dark;--bg:#121816;--card:#1a2220;--ink:#e7ece8;--muted:#94a49c;--line:#2b3532;--field-border:#3a4642;--field-border-hover:#4d5b56;--soft:#1e2b26;--sidebar-bg:#0e1513;--sidebar-text:#e7ece8;--sidebar-text-dim:rgba(231,236,232,.68);--sidebar-border:rgba(255,255,255,.09);--sidebar-hover:color-mix(in srgb,var(--accent) 16%,var(--sidebar-bg));--sidebar-active-bg:color-mix(in srgb,var(--accent) 22%,var(--sidebar-bg))}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:1500px;margin:0;padding:22px}.card{background:var(--card);border:1px solid var(--line);padding:18px}h2{margin:0 0 14px;font-size:20px}.filters{display:grid;grid-template-columns:1fr 220px 220px auto;gap:9px;align-items:end;margin-bottom:14px}label{font-size:12px;font-weight:650;color:var(--muted);display:block;margin-bottom:5px}input,select{width:100%;padding:9px 11px;border:1px solid var(--field-border);background:var(--card);color:var(--ink);font:inherit}input:hover,select:hover{border-color:var(--field-border-hover)}input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}button{border:1px solid var(--accent);padding:9px 14px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer;font-size:13.5px}button:hover{background:color-mix(in srgb,var(--accent) 85%,black);border-color:color-mix(in srgb,var(--accent) 85%,black)}table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}tbody tr:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}.change{white-space:pre-wrap}.old{color:#a53636}.new{color:#1f8a5f}.muted{color:var(--muted)}.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);padding:3px 8px;font-size:10.5px}.back{color:var(--accent);text-decoration:none;font-weight:650;display:inline-block;margin-bottom:12px}@media(max-width:900px){.filters{grid-template-columns:1fr}table{min-width:900px}.scroll{overflow:auto}}</style></head><body>
<div class="app-layout">
{% include "_sidebar.html" %}
<div class="app-content">
<main><a class="back" href="#" onclick="history.back();return false">← Einstellungen</a><div class="card"><h2>Änderungshistorie</h2><div class="filters"><div><label>Suche</label><input id="q" placeholder="Datensatz, Feld, alter/neuer Wert …" oninput="render()"></div><div><label>Bereich</label><select id="type" onchange="load()"><option value="">Alle Bereiche</option></select></div><div><label>Bearbeiter</label><input id="actor" placeholder="Name" onkeydown="if(event.key==='Enter')load()"></div><button onclick="load()">Aktualisieren</button></div><div class="muted" style="margin-bottom:10px">Das Protokoll ist über die normale ERP-Oberfläche nicht bearbeitbar oder löschbar.</div><div class="scroll"><table><thead><tr><th>Zeitpunkt</th><th>Wer</th><th>Aktion</th><th>Bereich / Datensatz</th><th>Feld</th><th>Änderung</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
</div>
</div>
<script>let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u){const r=await fetch(u);if(!r.ok)throw Error(r.statusText);return r.json()}async function load(){const t=document.getElementById('type').value,a=document.getElementById('actor').value.trim();rows=await api('/api/audit-logs?limit=500'+(t?'&entity_type='+encodeURIComponent(t):'')+(a?'&actor='+encodeURIComponent(a):''));const types=[...new Set(rows.map(x=>x.entity_type))].sort();const sel=document.getElementById('type'),old=sel.value;sel.innerHTML='<option value="">Alle Bereiche</option>'+types.map(x=>`<option>${esc(x)}</option>`).join('');if(types.includes(old))sel.value=old;render()}function render(){const q=document.getElementById('q').value.toLowerCase();const list=rows.filter(x=>!q||[x.actor_name,x.action,x.entity_type,x.entity_label,x.field_label,x.old_value,x.new_value].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('rows').innerHTML=list.map(x=>`<tr><td>${new Date(x.occurred_at+'Z').toLocaleString('de-DE')}</td><td><b>${esc(x.actor_name)}</b></td><td><span class="pill">${esc(x.action)}</span></td><td><b>${esc(x.entity_type)}</b><div class="muted">${esc(x.entity_label||('#'+(x.entity_id||'')))}</div></td><td>${esc(x.field_label||'—')}</td><td class="change">${x.action==='geändert'?`<span class="old">${esc(x.old_value??'—')}</span> → <span class="new">${esc(x.new_value??'—')}</span>`:esc(x.action==='angelegt'?'Datensatz angelegt':'Datensatz gelöscht')}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Keine Änderungen gefunden.</td></tr>'}load()</script></body></html>

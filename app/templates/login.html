<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DACHKONZEPTE ERP – Anmeldung</title>
<script>(function(){try{var t=localStorage.getItem('erp_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;--accent:{{ get_theme().accent_color }};--bg:#f4f6f5;--card:#fff;--ink:#182420;--muted:#5c6f68;--line:#dde5e1;--field-border:#b9c4bd;--field-border-hover:#8fa098;--danger:#c0362c;color:var(--ink);background:var(--bg)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121816;--card:#1a2220;--ink:#e7ece8;--muted:#94a49c;--line:#2b3532;--field-border:#3a4642;--field-border-hover:#4d5b56;--danger:#f2837a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);display:grid;min-height:100vh;place-items:center}
.card{width:min(430px,calc(100% - 30px));background:var(--card);border:1px solid var(--line);padding:28px}
h1{margin:0 0 4px;font-size:22px}
label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:10px 11px;border:1px solid var(--field-border);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px}
input:hover{border-color:var(--field-border-hover)}
input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
button{width:100%;margin-top:18px;border:1px solid var(--accent);padding:11px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer;font-size:13.5px}
button:hover{background:color-mix(in srgb,var(--accent) 85%,black);border-color:color-mix(in srgb,var(--accent) 85%,black)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.muted{color:var(--muted);font-size:12.5px}
.err{color:var(--danger);font-size:13px;margin-top:10px;font-weight:600}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <h1>DACHKONZEPTE ERP</h1>
  <div class="muted">Anmeldung für personengenaue Änderungshistorie</div>
  <label>Benutzername</label><input id="u" autofocus>
  <label>Passwort</label><input id="p" type="password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Anmelden</button>
  <div id="msg" class="err"></div>
  <p class="muted">Noch kein ERP-Benutzer angelegt? <a href="/users">Benutzerverwaltung öffnen</a>.</p>
</div>
<script>
async function login(){
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
  let d={};try{d=await r.json()}catch(_){}
  if(!r.ok){document.getElementById('msg').textContent=d.detail||'Anmeldung fehlgeschlagen.';return}
  // Seit 1.3.34: eine Anmeldung als Administrator ist erst mit bestätigtem zweitem Faktor
  // abgeschlossen -- bis dahin geht es zuerst nach "Mein Konto", nicht ans eigentliche Ziel.
  // Seit 1.3.48: location.search (z. B. "?next=%2Ftasks") wird dabei unverändert an /account
  // weitergereicht, sonst wüsste account.html nach der Bestätigung nicht mehr, wohin es
  // eigentlich gehen sollte (vorher ging es danach immer nur nach /account selbst, siehe
  // CLAUDE.md). Seit "Rechtekonzept" (Seiten-Klassifizierung): ohne next landet ein Monteur
  // auf /vor-ort statt /projects (dort ist er seit derselben Etappe serverseitig gesperrt) --
  // Python-Gegenstück app/permissions.py::default_home_page_for_role(), hier bewusst als reiner
  // JS-Zweig dupliziert statt geteilt (kein gemeinsames JS-Modul in diesem Projekt) und mit dem
  // hier etablierten Rückfall /projects, nicht dem server-seitig genutzten "/" (siehe dort).
  location.href=d.two_factor_required?('/account'+location.search):(new URLSearchParams(location.search).get('next')||(d.role==='field'?'/vor-ort':'/projects'))
}
</script>
</body>
</html>

<style>
/* Gemeinsame Zeichenfläche für Unterschriften (seit 1.8.34): Checkliste, Einsatzbericht, Vertrag. In beiden
   Themes hell mit dunklem Strich, wie Papier -- vorher setzte der Einsatzbericht var(--card) als Hintergrund,
   im dunklen Theme war die Unterschrift beim Zeichnen kaum zu sehen. Die Höhe setzt die Seite (style oder
   eigene Regel), die Breite folgt dem Platz. */
canvas.dk-unterschrift{display:block;width:100%;height:170px;background:#fff;border:1px dashed #8fa098;touch-action:none;cursor:crosshair;color-scheme:light}
</style>
<script>
/* unterschriftsfeld(canvas) macht aus einem <canvas class="dk-unterschrift"> eine Zeichenfläche und liefert
   {leer(), leeren(), alsBlob(), alsDataUrl()}. Zeichnen über Zeigerereignisse (Finger, Stift, Maus) mit
   setPointerCapture, in der Auflösung des Geräts (devicePixelRatio), Strich #111. Das PNG hat einen
   durchsichtigen Hintergrund wie bisher in Checkliste und Einsatzbericht -- auf dem PDF liegt es über dem
   Briefpapier, nicht als weißer Kasten darauf. Erneut aufgerufen (z. B. nach dem Neuzeichnen der Seite),
   beginnt das Feld leer. */
function unterschriftsfeld(canvas){
  const rect=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;
  canvas.width=Math.max(1,Math.round(rect.width*ratio));canvas.height=Math.max(1,Math.round(rect.height*ratio));
  const ctx=canvas.getContext('2d');
  ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  let zeichnet=false,inhalt=false,letzter=null;
  const pos=e=>{const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  canvas.onpointerdown=e=>{zeichnet=true;letzter=pos(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}
    ctx.beginPath();ctx.arc(letzter.x,letzter.y,ctx.lineWidth/2,0,2*Math.PI);ctx.fillStyle='#111';ctx.fill();e.preventDefault()};
  canvas.onpointermove=e=>{if(!zeichnet)return;const p=pos(e);ctx.beginPath();ctx.moveTo(letzter.x,letzter.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    if(Math.abs(p.x-letzter.x)+Math.abs(p.y-letzter.y)>0)inhalt=true;letzter=p;e.preventDefault()};
  const ende=()=>{zeichnet=false};
  canvas.onpointerup=ende;canvas.onpointercancel=ende;
  return {
    leer:()=>!inhalt,
    leeren:()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore();inhalt=false},
    alsBlob:()=>new Promise(res=>canvas.toBlob(res,'image/png')),
    alsDataUrl:()=>canvas.toDataURL('image/png'),
  };
}
</script>

<style>
/* Gemeinsame Zeichenfläche für Unterschriften (seit 1.8.34): Checkliste, Einsatzbericht, Vertrag. In beiden
   Themes hell mit dunklem Strich, wie Papier -- vorher setzte der Einsatzbericht var(--card) als Hintergrund,
   im dunklen Theme war die Unterschrift beim Zeichnen kaum zu sehen. Die Höhe setzt die Seite (style oder
   eigene Regel), die Breite folgt dem Platz. */
canvas.dk-unterschrift{display:block;width:100%;height:170px;background:#fff;border:1px dashed #8fa098;touch-action:none;cursor:crosshair;color-scheme:light}
</style>
<script>
/* unterschriftsfeld(canvas) macht aus einem <canvas class="dk-unterschrift"> eine Zeichenfläche und liefert
   {leer(), leeren(), alsBlob(), alsDataUrl(), vermessen()}. Zeichnen über Zeigerereignisse (Finger, Stift, Maus) mit
   setPointerCapture, in der Auflösung des Geräts (devicePixelRatio), Strich #111. Das PNG hat einen
   durchsichtigen Hintergrund wie bisher in Checkliste und Einsatzbericht -- auf dem PDF liegt es über dem
   Briefpapier, nicht als weißer Kasten darauf. Erneut aufgerufen (z. B. nach dem Neuzeichnen der Seite),
   beginnt das Feld leer.

   Seit 1.8.58: die Fläche vermisst sich neu, sobald sich ihre angezeigte Größe oder die Geräteauflösung ändert
   (Tablet gedreht, Fenster verkleinert, Dialog erst nach dem Aufruf sichtbar). Vorher blieb die Pixelgröße vom
   ersten Aufruf: nach dem Drehen streckte der Browser das Bild, und der Strich lag nicht mehr unter dem Finger.
   Die Striche werden als Punkte gemerkt (in der Größe beim ersten Strich) und nach dem Vermessen gleichmäßig
   skaliert neu gezeichnet -- ein Teil der Unterschrift geht beim Drehen nicht verloren und wird nicht verzerrt;
   die Strichstärke bleibt am Bildschirm gleich. ResizeObserver plus "resize" (Zoom ändert die Auflösung); eine
   Fläche, die nicht mehr im Dokument hängt, meldet sich ab. */
function unterschriftsfeld(canvas){
  if(canvas._dkAbmelden)canvas._dkAbmelden();  // ein früherer Aufruf für dieselbe Fläche
  const ctx=canvas.getContext('2d');
  const STRICH=2.4;
  let striche=[],aktuell=null,basis=null,breite=0,hoehe=0,ratio=1;
  const massstab=()=>basis?Math.min(breite/basis.w,hoehe/basis.h):1;
  function pinsel(){
    const s=massstab();
    ctx.setTransform(ratio*s,0,0,ratio*s,0,0);ctx.lineWidth=STRICH/s;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle='#111';ctx.fillStyle='#111';
  }
  function punkt(p){ctx.beginPath();ctx.arc(p.x,p.y,ctx.lineWidth/2,0,2*Math.PI);ctx.fill()}
  function linie(a,b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  function neuZeichnen(){
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
    pinsel();
    for(const s of striche){punkt(s[0]);for(let i=1;i<s.length;i++)linie(s[i-1],s[i])}
  }
  function vermessen(){
    const r=canvas.getBoundingClientRect(),neu=window.devicePixelRatio||1;
    if(!r.width||!r.height)return false;  // noch unsichtbar (geschlossener Dialog) -- der Beobachter meldet sich wieder
    const w=Math.max(1,Math.round(r.width*neu)),h=Math.max(1,Math.round(r.height*neu));
    if(w===canvas.width&&h===canvas.height&&neu===ratio&&breite)return false;
    breite=r.width;hoehe=r.height;ratio=neu;canvas.width=w;canvas.height=h;  // setzt die Fläche zurück
    neuZeichnen();
    return true;
  }
  vermessen();
  let zeichnet=false,inhalt=false;
  // Position in Punkten der Basisgröße (beim ersten Strich) -- unabhängig von späterem Drehen.
  const pos=e=>{const r=canvas.getBoundingClientRect(),s=massstab();return {x:(e.clientX-r.left)/s,y:(e.clientY-r.top)/s}};
  canvas.onpointerdown=e=>{
    if(!breite)vermessen();
    if(!basis)basis={w:breite,h:hoehe};
    zeichnet=true;try{canvas.setPointerCapture(e.pointerId)}catch(_){}
    pinsel();aktuell=[pos(e)];striche.push(aktuell);punkt(aktuell[0]);e.preventDefault()};
  canvas.onpointermove=e=>{if(!zeichnet)return;const p=pos(e),letzter=aktuell[aktuell.length-1];
    pinsel();linie(letzter,p);if(Math.abs(p.x-letzter.x)+Math.abs(p.y-letzter.y)>0)inhalt=true;aktuell.push(p);e.preventDefault()};
  const ende=()=>{zeichnet=false;aktuell=null};
  canvas.onpointerup=ende;canvas.onpointercancel=ende;
  let geplant=false;
  const pruefen=()=>{
    if(!canvas.isConnected){abmelden();return}
    if(geplant)return;geplant=true;
    requestAnimationFrame(()=>{geplant=false;if(canvas.isConnected)vermessen()});
  };
  const beobachter=window.ResizeObserver?new ResizeObserver(pruefen):null;
  if(beobachter)beobachter.observe(canvas);
  window.addEventListener('resize',pruefen);
  function abmelden(){if(beobachter)beobachter.disconnect();window.removeEventListener('resize',pruefen);canvas._dkAbmelden=null}
  canvas._dkAbmelden=abmelden;
  return {
    leer:()=>!inhalt,
    leeren:()=>{striche=[];aktuell=null;basis=null;inhalt=false;neuZeichnen()},
    alsBlob:()=>new Promise(res=>canvas.toBlob(res,'image/png')),
    alsDataUrl:()=>canvas.toDataURL('image/png'),
    vermessen,
  };
}
</script>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DACHKONZEPTE ERP · Changelog</title>
<script>(function(){try{var t=localStorage.getItem('erp_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--accent:{{ get_theme().accent_color }};--bg:#f4f6f5;--card:#fff;--ink:#182420;--muted:#5c6f68;--line:#dde5e1;--soft:#eef5f3;--sidebar-bg:#fbfdfc;--sidebar-text:#223028;--sidebar-text-dim:rgba(34,48,40,.7);--sidebar-border:#e2e8e5;--sidebar-hover:color-mix(in srgb,var(--accent) 8%,var(--sidebar-bg));--sidebar-active-bg:color-mix(in srgb,var(--accent) 12%,var(--sidebar-bg));--sidebar-active-text:var(--accent);--sidebar-active-border:var(--accent);color:var(--ink)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121816;--card:#1a2220;--ink:#e7ece8;--muted:#94a49c;--line:#2b3532;--soft:#1e2b26;--sidebar-bg:#0e1513;--sidebar-text:#e7ece8;--sidebar-text-dim:rgba(231,236,232,.68);--sidebar-border:rgba(255,255,255,.09);--sidebar-hover:color-mix(in srgb,var(--accent) 16%,var(--sidebar-bg));--sidebar-active-bg:color-mix(in srgb,var(--accent) 22%,var(--sidebar-bg))}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}main{padding:22px;max-width:900px;margin:auto}
.hero{background:var(--card);border:1px solid var(--line);padding:18px 22px;margin-bottom:18px}
.hero h1{margin:2px 0 4px}.muted{color:var(--muted)}
.entry{background:var(--card);border:1px solid var(--line);padding:16px 20px;margin-bottom:12px}
.entry-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.entry-version{background:var(--soft);color:var(--accent);font-weight:800;font-size:12px;padding:4px 9px;border:1px solid var(--line);white-space:nowrap}
.entry-title{font-weight:750;font-size:15px}
.entry p{margin:0 0 8px;line-height:1.55;font-size:13.5px}
.entry p:last-child{margin-bottom:0}
.entry code{background:var(--soft);padding:1px 5px;font-size:12.5px;border:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style></head><body>
<div class="app-layout">
{% include "_sidebar.html" %}
<div class="app-content">
<main>
<div class="hero"><h1>Changelog</h1><div class="muted">Welche Änderungen wann stattfanden – rückwirkend rekonstruiert seit Version 1.0.6, ab hier laufend fortgeschrieben. Neueste Version zuerst.</div></div>
<div id="entries"></div>
</main>
</div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){
  try{
    const r = await fetch('/api/changelog');
    if(!r.ok) throw new Error(r.statusText);
    const entries = await r.json();
    const el = document.getElementById('entries');
    el.innerHTML = entries.length ? entries.map(e => `<div class="entry"><div class="entry-head"><span class="entry-version">${esc(e.version)}</span><span class="entry-title">${esc(e.title)}</span></div>${e.html}</div>`).join('') : '<div class="empty">Keine Einträge gefunden.</div>';
  }catch(e){
    document.getElementById('entries').innerHTML = `<div class="empty">Changelog konnte nicht geladen werden: ${esc(e.message||e)}</div>`;
  }
}
load();
</script>
</body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stammdaten</title>
<script>(function(){try{var t=localStorage.getItem('erp_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--accent:{{ get_theme().accent_color }};--bg:#f4f6f5;--card:#fff;--ink:#182420;--muted:#5c6f68;--line:#dde5e1;--field-border:#b9c4bd;--field-border-hover:#8fa098;--soft:#eef5f3;color:var(--ink)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121816;--card:#1a2220;--ink:#e7ece8;--muted:#94a49c;--line:#2b3532;--field-border:#3a4642;--field-border-hover:#4d5b56;--soft:#1e2b26}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 24px}.back{color:var(--accent);text-decoration:none;font-weight:650}
.wrap{max-width:1000px;margin:24px auto;background:var(--card);border:1px solid var(--line);padding:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.field{display:grid;grid-template-columns:170px minmax(0,1fr);column-gap:14px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.field>label:first-child~*{grid-column:2}
.field>*:first-child:not(label){grid-column:1/-1}
.field>*:first-child:not(label)~*{grid-column:1/-1}
label{display:block;margin:0;padding-top:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--field-border);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px}
input:hover,select:hover,textarea:hover{border-color:var(--field-border-hover)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{resize:vertical}
button{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:10px 16px;font-weight:650;cursor:pointer;font-size:13.5px}
button:hover{background:color-mix(in srgb,var(--accent) 85%,black);border-color:color-mix(in srgb,var(--accent) 85%,black)}
.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.secondary:hover{background:var(--soft)}
.muted{color:var(--muted);font-size:12px}
.extra{display:grid;grid-template-columns:150px 170px 1fr 40px;gap:8px;margin:8px 0;padding:9px;background:var(--soft);border:1px solid var(--line)}
.full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.check input{width:auto}.check label{padding-top:0}
.hidden{display:none!important}
.hint{background:var(--soft);border-left:3px solid var(--accent);padding:10px 12px;font-size:13px;margin:6px 0;color:var(--ink)}
@media(max-width:700px){.grid,.extra{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:480px){.field{display:block}label{padding-top:0}}
</style></head><body><header><a id="back" class="back" href="#" onclick="history.back();return false">← Stammdaten</a></header><div class="wrap"><h1 id="heading">Stammdaten</h1><p id="help" class="muted"></p><div id="form"></div><button id="saveBtn" onclick="save()">Speichern</button> <span id="msg" class="muted"></span></div>
<script>
const type='{{ data_type }}';const recordId={{ record_id|default('null') }};const editing=recordId!==null;let customers=[],categories=[],salutations=[],record=null,employees=[],resources=[],resourceTypes=[],functions=[],laborRateSettings={weeks_per_year:52};
const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const api=async(u,o)=>{const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||r.statusText);return d};const v=id=>document.getElementById(id)?.value??'';const n=v=>String(v??'').trim()?String(v).trim():null;const money=x=>x==null?'—':Number(x).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
function customerForm(){el('heading').textContent='Kunde anlegen';el('help').textContent='Die Kundennummer wird vorgeschlagen, kann aber für die Übernahme aus dem bisherigen ERP überschrieben werden. Die Hauptadresse wird automatisch als erstes Objekt angelegt.';el('form').innerHTML=`<div class="grid"><div class="field"><label>Kundennummer</label><input id="customerNumber"></div><div class="field"><label>Kundenkategorie</label><select id="category">${categories.map(x=>`<option value="${esc(x.value)}" ${x.is_default?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div><div class="field"><label>Anrede</label><select id="salutation"><option value="">—</option>${salutations.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select></div><div class="field"><label>Titel</label><input id="title"></div><div class="field"><label>Vorname</label><input id="firstName"></div><div class="field"><label>Nachname / Firma *</label><input id="lastName"></div><div class="field"><label>Ansprechpartner</label><input id="contact"></div><div class="field"><label>Primäre Rufnummer</label><input id="phone"></div><div class="field"><label>Mobil</label><input id="mobile"></div><div class="field"><label>Fax</label><input id="fax"></div><div class="field"><label>Primäre E-Mail</label><input id="email" type="email"></div><div class="field"><label>Zweite E-Mail-Adresse</label><input id="email2" type="email"></div><div class="field"><label>Straße</label><input id="street"></div><div class="field"><label>Land</label><input id="country" value="Deutschland"></div><div class="field"><label>PLZ / Ort</label><div style="display:grid;grid-template-columns:110px 1fr;gap:8px"><input id="zip"><input id="city"></div></div><div class="field full"><label>Interne Notizen</label><textarea id="notes" rows="3"></textarea></div><div class="field full"><div style="display:flex;justify-content:space-between;align-items:center"><div><label>Weitere Kundeninformationen</label><span class="muted">Telefon, E-Mail, Geburtstag oder freie Information</span></div><button type="button" class="secondary" onclick="addExtra()">+ Information</button></div><div id="extras"></div></div></div>`}
function addExtra(){let d=document.createElement('div');d.className='extra';d.innerHTML=`<select class="etype"><option value="Telefon">Telefon</option><option value="E-Mail">E-Mail</option><option value="Geburtstag">Geburtstag</option><option value="Information">Information</option></select><input class="elabel" placeholder="Bezeichnung"><input class="evalue" placeholder="Wert"><button type="button" class="secondary" onclick="this.parentElement.remove()">×</button>`;el('extras').appendChild(d)}
function propertyForm(){el('heading').textContent=editing?'Objekt bearbeiten':'Objekt anlegen';el('help').textContent=editing?'Objektadresse, Zuordnung zum Kunden und Hinweise können hier nachträglich geändert werden.':'Objekte gehören immer zu einem Kunden. Die Kunden-Hauptadresse wird bereits automatisch als Objekt „Hauptadresse“ angelegt.';el('form').innerHTML=`<div class="grid"><div class="field full"><label>Kunde *</label><select id="customer">${customers.map(c=>`<option value="${c.id}">${esc(c.customer_number)} · ${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>Objektbezeichnung *</label><input id="name" placeholder="z. B. Wohnhaus Aachen"></div><div class="field"><label>Straße</label><input id="street"></div><div class="field"><label>PLZ / Ort</label><div style="display:grid;grid-template-columns:110px 1fr;gap:8px"><input id="zip"><input id="city"></div></div><div class="field full"><label>Notizen</label><textarea id="notes" rows="4"></textarea></div></div>`;let cid=new URLSearchParams(location.search).get('customer_id');if(cid&&!editing)document.getElementById('customer').value=cid;if(record){el('customer').value=record.customer_id;el('name').value=record.name||'';el('street').value=record.street||'';el('zip').value=record.postal_code||'';el('city').value=record.city||'';el('notes').value=record.notes||''}}
function activeFunctions(){return functions.filter(f=>f.active||f.id===record?.function_id)}
function renderFunctionSelect(selected=null){const sel=el('functionId');const opts=activeFunctions().map(f=>`<option value="${f.id}" ${Number(selected)===f.id?'selected':''}>${esc(f.name)}${f.active?'':' (inaktiv)'}</option>`).join('');sel.innerHTML='<option value="">Bitte auswählen …</option>'+opts;syncFunction()}
function selectedFunction(){return functions.find(f=>f.id===Number(v('functionId')))||null}
function syncFunction(){const f=selectedFunction();el('groupHint').textContent=f?`Mitarbeitergruppe: ${f.employee_group==='gewerblich'?'Gewerblich':'Kaufmännisch'}`:'Bitte Funktion auswählen.';syncCompensation()}
function syncCompensation(){const f=selectedFunction(),commercial=f?.employee_group==='gewerblich',ctype=v('compensationType')||'hourly';el('hourlyWageField').style.display=ctype==='hourly'?'block':'none';el('monthlySalaryField').style.display=ctype==='fixed_salary'?'block':'none';el('effectiveWageInfo').style.display=ctype==='fixed_salary'?'block':'none';el('wageRequired').textContent=commercial&&ctype==='hourly'?'*':'optional';el('salaryRequired').textContent=commercial&&ctype==='fixed_salary'?'*':'optional';if(ctype==='fixed_salary'){const monthly=Number(v('monthlySalary')||0),weekly=Number(v('weeklyHours')||0),weeks=Number(laborRateSettings.weeks_per_year||52),annualHours=weekly*weeks,effective=annualHours>0?monthly*12/annualHours:0;el('effectiveWage').textContent=effective>0?money(effective)+'/h':'—';el('wageFormula').textContent=monthly>0&&annualHours>0?`${money(monthly)} × 12 ÷ (${weekly.toLocaleString('de-DE')} h × ${weeks.toLocaleString('de-DE')} Wochen) = ${effective.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})} €/h`:'Monatsfestgehalt, Wochenstunden und Wochen/Jahr ergeben den kalkulatorischen Stundenwert.'}}
function employeeForm(){el('heading').textContent=editing?'Mitarbeiter bearbeiten':'Mitarbeiter anlegen';el('help').textContent='Die auswählbaren Funktionen werden zentral unter Einstellungen → Mitarbeiterfunktionen gepflegt. Die Mitarbeitergruppe „gewerblich/kaufmännisch“ wird daraus automatisch übernommen. Bei gewerblichen Funktionen ist je nach Vergütungsart ein Stundenlohn oder Monatsfestgehalt erforderlich.';el('form').innerHTML=`<div class="grid"><div class="field"><label>Mitarbeiternummer</label><input id="employeeNumber"></div><div class="field"><label>Status</label><select id="activeSelect"><option value="1">Aktiv</option><option value="0">Inaktiv</option></select></div><div class="field full check"><input id="availableAsCaseworker" type="checkbox"><label>Als Sachbearbeiter für Angebote verfügbar</label></div><div class="field full check"><input id="showOnPlanningBoard" type="checkbox" checked><label>In Plantafel anzeigen / Kapazität berücksichtigen</label></div><div class="field"><label>Vorname *</label><input id="firstName"></div><div class="field"><label>Nachname *</label><input id="lastName"></div><div class="field full"><label>Funktion / Tätigkeit *</label><select id="functionId" onchange="syncFunction()"></select><div id="groupHint" class="muted"></div></div><div class="field"><label>Wochenstunden *</label><input id="weeklyHours" type="number" step="0.01" value="40" oninput="syncCompensation()"></div><div class="field"><label>Vergütungsart *</label><select id="compensationType" onchange="syncCompensation()"><option value="hourly">Stundenlohn</option><option value="fixed_salary">Festgehalt</option></select></div><div class="field full"><label>Kosten-Zuordnung *</label><select id="costAllocation"><option value="labor_rate">Stundenkostenverrechnungssatz / direkte Lohnkosten</option><option value="variable_overhead">Variable Gemeinkosten</option><option value="excluded">Nicht in dieser Berechnung berücksichtigen</option></select><div class="muted">Mitarbeiter in „Variable Gemeinkosten“ werden mit Jahresbrutto und AG-Nebenkosten in den variablen Gemeinkostenblock übernommen.</div></div><div class="field" id="hourlyWageField"><label>Stundenlohn brutto €/h <span id="wageRequired">*</span></label><input id="hourlyWage" type="number" step="0.01"></div><div class="field" id="monthlySalaryField" style="display:none"><label>Festgehalt brutto €/Monat <span id="salaryRequired">*</span></label><input id="monthlySalary" type="number" step="0.01" oninput="syncCompensation()"></div><div class="field full" id="effectiveWageInfo" style="display:none"><div class="hint"><b>Kalkulatorischer Stundenlohn: <span id="effectiveWage">—</span></b><div class="muted" id="wageFormula"></div></div></div><div class="field full"><label>Straße / Hausnummer</label><input id="street"></div><div class="field"><label>PLZ</label><input id="postalCode"></div><div class="field"><label>Ort</label><input id="city"></div><div class="field full"><label>Land</label><input id="country" value="Deutschland"></div><div class="field"><label>Telefon</label><input id="phone" type="tel"></div><div class="field"><label>Mobil</label><input id="mobile" type="tel"></div><div class="field"><label>E-Mail</label><input id="email" type="email"></div><div class="field"><label>Geburtstag</label><input id="birthday" type="date"></div><div class="field full"><label>Wichtige Informationen</label><textarea id="importantInfo" rows="4" placeholder="z. B. Führerscheinklassen, besondere Kenntnisse, interne Hinweise …"></textarea></div></div>`;renderFunctionSelect(record?.function_id);if(record){el('employeeNumber').value=record.employee_number||'';el('firstName').value=record.first_name||'';el('lastName').value=record.last_name||'';el('weeklyHours').value=record.weekly_hours;el('compensationType').value=record.compensation_type||'hourly';el('hourlyWage').value=record.compensation_type==='fixed_salary'?'':(record.hourly_wage??'');el('monthlySalary').value=record.monthly_salary??'';el('costAllocation').value=record.cost_allocation||'excluded';el('activeSelect').value=record.active?'1':'0';el('street').value=record.street||'';el('postalCode').value=record.postal_code||'';el('city').value=record.city||'';el('country').value=record.country||'Deutschland';el('phone').value=record.phone||'';el('mobile').value=record.mobile||'';el('email').value=record.email||'';el('birthday').value=record.birthday||'';el('importantInfo').value=record.important_info||'';el('availableAsCaseworker').checked=!!record.available_as_caseworker;el('showOnPlanningBoard').checked=record.show_on_planning_board!==false}syncFunction();syncCompensation()}
function supplierForm(){el('heading').textContent=editing?'Lieferant bearbeiten':'Lieferant anlegen';el('help').textContent='Lieferanten stehen anschließend in der Arbeitsvorbereitung als Dropdown zur Verfügung.';el('form').innerHTML=`<div class="grid"><div class="field"><label>Lieferantennummer</label><input id="supplierNumber"></div><div class="field"><label>Status</label><select id="activeSelect"><option value="1">Aktiv</option><option value="0">Inaktiv</option></select></div><div class="field full"><label>Name / Firma *</label><input id="name"></div><div class="field"><label>Ansprechpartner</label><input id="contact"></div><div class="field"><label>Unsere Kundennummer beim Lieferanten</label><input id="customerAtSupplier"></div><div class="field"><label>Straße</label><input id="street"></div><div class="field"><label>PLZ / Ort</label><div style="display:grid;grid-template-columns:110px 1fr;gap:8px"><input id="zip"><input id="city"></div></div><div class="field"><label>Telefon</label><input id="phone"></div><div class="field"><label>E-Mail</label><input id="email" type="email"></div><div class="field full"><label>Website</label><input id="website"></div><div class="field full"><label>Notizen</label><textarea id="notes" rows="4"></textarea></div></div>`;if(record){el('supplierNumber').value=record.supplier_number||'';el('name').value=record.name||'';el('contact').value=record.contact_person||'';el('customerAtSupplier').value=record.customer_number_at_supplier||'';el('street').value=record.street||'';el('zip').value=record.postal_code||'';el('city').value=record.city||'';el('phone').value=record.phone||'';el('email').value=record.email||'';el('website').value=record.website||'';el('notes').value=record.notes||'';el('activeSelect').value=record.active?'1':'0'}}
function resourceForm(){el('heading').textContent=editing?'Ressource bearbeiten':'Ressource anlegen';el('help').textContent='Fahrzeuge, Maschinen, Anhänger und Geräte können Teams zugeordnet und später in der Planungstafel disponiert werden.';el('form').innerHTML=`<div class="grid"><div class="field"><label>Ressourcennummer</label><input id="resourceNumber"></div><div class="field"><label>Ressourcentyp *</label><select id="resourceType">${resourceTypes.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select></div><div class="field full"><label>Bezeichnung *</label><input id="name" placeholder="z. B. Sprinter 1 / Böcker AHK36"></div><div class="field"><label>Hersteller</label><input id="manufacturer"></div><div class="field"><label>Modell</label><input id="model"></div><div class="field"><label>Kennzeichen / Seriennummer</label><input id="identifier"></div><div class="field"><label>Status</label><select id="activeSelect"><option value="1">Aktiv</option><option value="0">Inaktiv</option></select></div><div class="field full"><label>Notizen</label><textarea id="notes" rows="4"></textarea></div></div>`;if(record){el('resourceNumber').value=record.resource_number||'';el('resourceType').value=record.resource_type||'';el('name').value=record.name||'';el('manufacturer').value=record.manufacturer||'';el('model').value=record.model||'';el('identifier').value=record.identifier||'';el('notes').value=record.notes||'';el('activeSelect').value=record.active?'1':'0'}}
function teamForm(){el('heading').textContent=editing?'Kolonne / Team bearbeiten':'Kolonne / Team anlegen';el('help').textContent='Die Stammbesetzung wird bei Zuweisung in eine Arbeitsvorbereitung als Projekteinsatz übernommen. Spätere Änderungen am Stammteam verändern alte Projekteinsätze nicht rückwirkend.';const selectedEmployees=new Map((record?.employees||[]).map(x=>[Number(x.employee_id),x]));const selectedResources=new Map((record?.resources||[]).map(x=>[Number(x.resource_id),x]));el('form').innerHTML=`<div class="grid"><div class="field"><label>Teamnummer</label><input id="teamNumber"></div><div class="field"><label>Status</label><select id="activeSelect"><option value="1">Aktiv</option><option value="0">Inaktiv</option></select></div><div class="field full"><label>Bezeichnung *</label><input id="name" placeholder="z. B. Kolonne 1"></div><div class="field full"><label>Beschreibung</label><textarea id="description" rows="3"></textarea></div><div class="field full"><label>Mitarbeiter</label><div>${employees.filter(x=>x.active||selectedEmployees.has(x.id)).map(x=>{let a=selectedEmployees.get(x.id);return `<div style="display:grid;grid-template-columns:28px minmax(180px,1fr) minmax(180px,1fr);gap:8px;align-items:center;padding:7px;border-bottom:1px solid var(--line)"><input style="width:auto" class="team-employee" type="checkbox" value="${x.id}" ${a?'checked':''}><span><b>${esc(x.first_name+' '+x.last_name)}</b><span class="muted"> · ${esc(x.function_name||'')}</span></span><input class="team-employee-role" data-id="${x.id}" placeholder="Rolle im Team, z. B. Vorarbeiter" value="${esc(a?.role||'')}"></div>`}).join('')||'<div class="muted">Keine aktiven Mitarbeiter vorhanden.</div>'}</div></div><div class="field full"><label>Fuhrpark / Maschinen / Geräte</label><div>${resources.filter(x=>x.active||selectedResources.has(x.id)).map(x=>{let a=selectedResources.get(x.id);return `<div style="display:grid;grid-template-columns:28px minmax(180px,1fr) minmax(180px,1fr);gap:8px;align-items:center;padding:7px;border-bottom:1px solid var(--line)"><input style="width:auto" class="team-resource" type="checkbox" value="${x.id}" ${a?'checked':''}><span><b>${esc(x.name)}</b><span class="muted"> · ${esc(x.resource_type)}</span></span><input class="team-resource-role" data-id="${x.id}" placeholder="Einsatz / Rolle" value="${esc(a?.role||'')}"></div>`}).join('')||'<div class="muted">Noch keine Ressourcen angelegt.</div>'}</div></div></div>`;if(record){el('teamNumber').value=record.team_number||'';el('name').value=record.name||'';el('description').value=record.description||'';el('activeSelect').value=record.active?'1':'0'}}
function catalogForm(){el('heading').textContent='Katalog anlegen';el('help').textContent='Kataloge gruppieren Leistungen unabhängig voneinander. Eigene Kalkulationsgrundlagen je Katalog und das Zuordnen von Leistungen sind für eine spätere Ausbaustufe vorgesehen -- hier wird zunächst nur der Katalog selbst angelegt.';el('form').innerHTML=`<div class="grid"><div class="field full"><label>Name *</label><input id="name" placeholder="z. B. Trockenbau-Katalog 2026"></div><div class="field full"><label>Beschreibung</label><textarea id="description" rows="3" placeholder="Optional"></textarea></div></div>`}
function materialForm(){el('heading').textContent=editing?'Material bearbeiten':'Material anlegen';el('help').textContent='Materialien aus Importen werden automatisch angelegt -- hier lassen sich eigene Materialien ergänzen oder bestehende korrigieren.';el('form').innerHTML=`<div class="grid"><div class="field"><label>Artikelnummer</label><input id="articleNumber" placeholder="Optional"></div><div class="field"><label>Einheit *</label><input id="unit" placeholder="z. B. Stk, m, kg"></div><div class="field full"><label>Name *</label><input id="name"></div><div class="field"><label>Einkaufspreis (€) *</label><input id="purchasePrice" placeholder="0,00"></div><div class="field"><label>Preisbasis</label><input id="priceBasis" placeholder="1"></div></div>`;if(record){el('articleNumber').value=record.article_number||'';el('unit').value=record.unit||'';el('name').value=record.name||'';el('purchasePrice').value=record.purchase_price??'';el('priceBasis').value=record.price_basis??'1'}else{el('priceBasis').value='1'}}
function materialGroupForm(){el('heading').textContent='Materialkatalog anlegen';el('help').textContent='Materialkataloge gruppieren Materialien unabhängig voneinander, genau wie Kataloge bei Leistungen.';el('form').innerHTML=`<div class="grid"><div class="field full"><label>Name *</label><input id="name" placeholder="z. B. Eigene Materialien"></div><div class="field full"><label>Beschreibung</label><textarea id="description" rows="3" placeholder="Optional"></textarea></div></div>`}
async function init(){if(type==='properties'&&editing){location.href='/properties/'+recordId;return}
if(type==='customers'){let [p,g,s]=await Promise.all([api('/api/settings/number-sequences/customer/preview'),api('/api/settings/option-groups/customer_categories'),api('/api/settings/option-groups/customer_salutations')]);categories=g.options.filter(x=>x.active);salutations=s.options.filter(x=>x.active);customerForm();el('customerNumber').value=p.preview}else if(type==='properties'){customers=await api('/api/customers');if(editing)record=await api(`/api/properties/${recordId}`);propertyForm()}else if(type==='employees'){[functions,laborRateSettings]=await Promise.all([api('/api/settings/employee-functions'),api('/api/labor-rate-settings')]);if(editing)record=await api(`/api/employees/${recordId}`);employeeForm()}else if(type==='suppliers'){if(editing)record=await api(`/api/suppliers/${recordId}`);supplierForm()}else if(type==='resources'){let g=await api('/api/settings/option-groups/resource_types');resourceTypes=g.options.filter(x=>x.active);if(editing)record=await api(`/api/resources/${recordId}`);resourceForm()}else if(type==='teams'){[employees,resources]=await Promise.all([api('/api/employees'),api('/api/resources')]);if(editing)record=await api(`/api/teams/${recordId}`);teamForm()}else if(type==='catalogs'){catalogForm()}else if(type==='materials'){if(editing)record=await api(`/api/materials/${recordId}`);materialForm()}else if(type==='materialGroups'){materialGroupForm()}else throw Error('Unbekannter Stammdatenbereich')}

l,active:v('activeSelect')==='1'};url=editing?`/api/employees/${recordId}`:'/api/employees'}else if(type==='suppliers'){body={supplier_number:n(v('supplierNumber')),name:v('name').trim(),contact_person:n(v('contact')),street:n(v('street')),postal_code:n(v('zip')),city:n(v('city')),country:record?.country||'Deutschland',phone:n(v('phone')),email:n(v('email')),website:n(v('website')),customer_number_at_supplier:n(v('customerAtSupplier')),notes:n(v('notes')),active:v('activeSelect')==='1'};url=editing?`/api/suppliers/${recordId}`:'/api/suppliers'}else if(type==='resources'){body={resource_number:n(v('resourceNumber')),resource_type:v('resourceType'),name:v('name').trim(),manufacturer:n(v('manufacturer')),model:n(v('model')),identifier:n(v('identifier')),notes:n(v('notes')),active:v('activeSelect')==='1'};url=editing?`/api/resources/${recordId}`:'/api/resources'}else if(type==='teams'){body={team_number:n(v('teamNumber')),name:v('name').trim(),description:n(v('description')),active:v('activeSelect')==='1',employees:[...document.querySelectorAll('.team-employee:checked')].map(x=>({employee_id:Number(x.value),role:n(document.querySelector(`.team-employee-role[data-id="${x.value}"]`)?.value)})),resources:[...document.querySelectorAll('.team-resource:checked')].map(x=>({resource_id:Number(x.value),role:n(document.querySelector(`.team-resource-role[data-id="${x.value}"]`)?.value)}))};url=editing?`/api/teams/${recordId}`:'/api/teams'}else if(type==='catalogs'){body={name:v('name').trim(),description:n(v('description'))};url='/api/catalogs'}else if(type==='materials'){const catalogIdParam=new URLSearchParams(location.search).get('catalog_id');body={article_number:n(v('articleNumber')),name:v('name').trim(),unit:v('unit').trim(),purchase_price:v('purchasePrice').replace(',','.'),price_basis:v('priceBasis').replace(',','.')||'1'};if(!editing&&catalogIdParam)body.catalog_id=Number(catalogIdParam);url=editing?`/api/materials/${recordId}`:'/api/materials'}else if(type==='materialGroups'){body={name:v('name').trim(),description:n(v('description'))};url='/api/material-groups'}else{throw Error('Unbekannter Stammdatenbereich')}if(!body.name&&type!=='employees'&&type!=='customers')throw Error('Bitte die Pflichtfelder ausfüllen.');if(type==='employees'&&(!body.first_name||!body.last_name))throw Error('Vor- und Nachname sind erforderlich.');if(type==='customers'&&!body.last_name)throw Error('Bitte Nachname / Firma ausfüllen.');const saved=await api(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(type==='properties'&&!editing){location.href='/properties/'+saved.id;return}location.href='/master-data#'+type}catch(e){el('msg').textContent='Fehler: '+e.message}}

<script>
/* Seit 1.9.115 (Stufe 5, R1, Punkt 5, Befund F14): eine Darstellung der Änderung einer Historienzeile für /history und den Verlauf der Projektmappe.
   „geändert“ und jede andere Aktion mit Werten (z. B. „Pausen neu gerechnet“: Pause des Tages alt -> neu) als alt -> neu, „verworfen“ mit der Begründung,
   „angelegt“ / „gelöscht“ als Satz. Bis 1.9.114 zeigte /history jede andere Aktion als „Datensatz gelöscht“ und die Projektmappe nur ihren Namen.
   Seit 1.9.123 kommen die Werte lesbar vom Server (app/verlauf_namen.py) und eine Einheit (x.einheit) steht hinter dem neuen: „850 → 851 m²“.
   verlaufAenderung(zeile) -> HTML (Werte über die eigene Maskierung).
   Seit 1.9.139 verlaufEinzelheit(zeile) -> eine Zeile unter „Einzelheiten“ für Akte und Kundenakte: der kurze Satz vom Server (Zahlungen) oder Art, Name und Änderung.
   Seit 1.9.149 verlaufMehrEinzelheiten(eintrag) -> ob „Einzelheiten“ mehr zeigen als die Zeile: bei einer einzigen Änderung steht schon alles in der Überschrift. */
const _verlaufEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function verlaufAenderung(x){
  const einheit=x.einheit?' '+_verlaufEsc(x.einheit):'';
  const altNeu=()=>`<span class="old">${_verlaufEsc(x.old_value??'—')}</span> → <span class="new">${_verlaufEsc(x.new_value??'—')}</span>${einheit}`;
  if(x.action==='angelegt')return 'Datensatz angelegt';
  if(x.action==='gelöscht')return 'Datensatz gelöscht';
  if(x.action==='verworfen')return 'Verworfen'+(x.new_value?' – Begründung: '+_verlaufEsc(x.new_value):'');
  if(x.action==='geändert'||x.old_value!=null||x.new_value!=null)return altNeu();
  return _verlaufEsc(x.action);
}
function verlaufMehrEinzelheiten(e){
  const n=(e.einzelheiten||[]).length;
  return n>1||(n===1&&!!e.versand);
}
function verlaufEinzelheit(z){
  if(z.kurz)return _verlaufEsc(z.kurz);
  return `<b>${_verlaufEsc(z.entity_type_label||z.entity_type)}</b> ${_verlaufEsc(z.entity_label||'')}${z.field_label?` · ${_verlaufEsc(z.field_label)}`:''}: ${verlaufAenderung(z)}`;
}
</script>

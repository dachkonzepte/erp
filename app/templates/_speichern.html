<script>
/* Gemeinsamer Baustein gegen veraltete Antworten (seit 1.8.95, Nebenbefunde 1 und 3 aus 1.8.94; docs/archiv/befund-vor-echtbetrieb.md,
   "Umsetzung 1.8.95" und "Umsetzung 1.8.96"). Eine Seite übernimmt nie eine Antwort, die älter ist als eine schon angewandte, und
   meldet "Gespeichert." erst, wenn die Antwort angewandt ist.

   Ein Bereich ist, was eine Antwort auf der Seite ersetzt: ein Formular, eine Karte, eine Liste oder ein Feld (ein Name je Seite,
   frei gewählt). Je Bereich gilt:
   - Jede Anfrage, deren Antwort die Seite übernimmt, bekommt beim Absenden die nächste laufende Nummer des Bereichs. Übernommen wird
     eine Antwort nur, wenn noch keine mit höherer Nummer angewandt ist -- sonst ist sie veraltet und wird verworfen.
   - Speichern geht nacheinander hinaus: das nächste erst, wenn die Antwort des vorigen da ist. So bearbeitet der Server sie in der
     Reihenfolge der Nummern, und die Antwort mit der höchsten Nummer kennt alles, was davor gespeichert wurde. Gebaut wird die
     Anfrage trotzdem sofort (URL und Body mit den Werten, die beim Klick im Formular stehen) -- nur das Senden wartet.
   - Lesen geht erst hinaus, wenn im Bereich kein Speichern mehr unterwegs ist -- es kennt alles, was vorher gespeichert wurde.

   lesen(bereich, anfrage, anwenden) -> true, wenn angewandt; false, wenn veraltet (verworfen)
     anfrage(): startet die Anfrage(n) -- auch mehrere über Promise.all -- und gibt deren Ergebnis zurück. anwenden(daten) übernimmt
     es (Zustand setzen, zeichnen) und läuft nur, wenn es nicht veraltet ist. Ein Fehler der Anfrage geht an den Aufrufer -- seit
     1.8.97 nur, wenn er nicht veraltet ist (sonst false wie bei einer veralteten Antwort); nach einem Fehler des neuesten Lesens wird
     ein älteres, das danach ankommt, verworfen. Seit 1.8.97 geht jede Anfrage einer Seite über lesen()/speichern()/abschliessen(),
     auch das erste Laden (tests/test_v400_lesen_ueber_baustein.py, Ausnahmen nur ohne Formular).
   speichern(bereich, anfrage, {anwenden, neuLaden}) -> Antwort des Speicherns
     anfrage(): genau ein schreibender Aufruf, ()=>api(…) bzw. ()=>fetch(…), sonst nichts (tests/test_v398_speichern_baustein.py);
       speichern() ruft ihn sofort auf, der Aufruf muss fetch() sofort erreichen (api() tut das als erste Anweisung).
     anwenden(daten): die Antwort des Speicherns trägt den Stand des Bereichs (z. B. alle Antworten einer Checkliste) und wird wie bei
       lesen() nur übernommen, wenn sie nicht veraltet ist.
     neuLaden(): danach neu laden -- über lesen(), am besten im selben Bereich.
     speichern() kehrt erst zurück, wenn angewandt bzw. neu geladen ist: ein Statustext wie "Gespeichert." steht deshalb hinter
     await speichern(…). Bei einem Fehler wird nichts angewandt und nicht neu geladen, der Fehler geht an den Aufrufer; eine
     fetch-Antwort mit Fehlerstatus (Response.ok false) gibt speichern() unverändert zurück, ebenfalls ohne anzuwenden.
   abschliessen(bereich, anfrage, {anwenden, neuLaden}) -- seit 1.8.96, wie speichern() für abschließende Aktionen (Unterschrift,
     Festschreiben, Versand, Buchung, Storno u. ä.; Liste in tests/test_v399_abschliessen.py): die Anfrage geht erst hinaus, wenn
     jedes Speichern der ganzen Seite, das beim Aufruf lief oder wartete, zurück ist -- und gar nicht, wenn eines davon gescheitert
     ist oder ein Bereich der Seite nach einer Zeitüberschreitung unklar ist (Fehler an den Aufrufer, nichts gesendet). Eingaben, die
     _debounce.html noch zurückhält, werden vorher gespeichert. Seit 1.8.99 (Festlegung 1.8.96 Nr. 7, korrigiert): auch ein früher
     gescheitertes Speichern sperrt, bis ein späteres Speichern im selben Bereich gelingt -- das gilt nur für speichern(); eine vom
     Server abgelehnte abschließende Aktion sperrt keine weitere (eine unklare schon, siehe Zeitlimit). Seit 1.8.109 sperrt auch ein
     Zahlenfeld, das _zahl.html abgelehnt hat (aria-invalid), bis es korrigiert ist.

   Zeitlimit (seit 1.8.96): kommt auf ein Speichern 60 s nach dem Senden keine Antwort, bricht der Baustein die Anfrage ab. Beim
   Hochladen (Body FormData, Blob/File oder Binärdaten) seit 1.8.99 erst 60 s nach dem Ende der Übertragung: die Anfrage geht dann über
   XMLHttpRequest (dessen upload-Ereignisse das Ende melden) und kommt als gewöhnliche Response zurück -- ein großes Foto über eine
   langsame Verbindung ist sonst "unklar", obwohl es noch läuft (Nebenbefund 1 aus 1.8.96). Ob der
   Server sie bearbeitet hat, ist dann unklar: der Bereich ist "unklar", speichern() endet mit einem Fehler, der das sagt und um
   Neuladen und Prüfen bittet (die Seite zeigt ihn wie jeden Fehler, dazu ein Hinweis oben auf der Seite mit "Seite neu laden");
   wartende und neue Speichervorgänge dieses Bereichs gehen nicht mehr hinaus (sie enden mit demselben Hinweis), bis die Seite neu
   geladen ist. Solange ein Speichern läuft oder wartet, warnt der Browser beim Verlassen der Seite.

   Doppelklick (seit 1.8.97): dieselbe Anfrage (Methode, Adresse und Body als Text gleich) noch einmal, während die erste im Bereich
   wartet oder unterwegs ist, geht nicht ein zweites Mal hinaus und zählt nicht als wartend -- sie bekommt das Ergebnis der ersten.

   Der Baustein darf in einer Seite mehrfach eingebunden sein (Seite und Teilvorlage): der Stand hängt an window, und es gibt hier
   deshalb keine class/const/let auf oberster Ebene. */
window.__dkBereiche = window.__dkBereiche || new Map();
window.__dkSpeichern = window.__dkSpeichern || new Set();  // laufendes und wartendes Speichern der Seite: {bereich, ergebnis}
window.__dkZeitlimit = window.__dkZeitlimit || 60000;      // ms ab dem Senden
if (!window.__dkVerlassen && typeof window.addEventListener === 'function') {
  window.__dkVerlassen = true;
  window.addEventListener('beforeunload', e => {
    if (!window.__dkSpeichern.size) return;
    e.preventDefault();
    e.returnValue = '';
    return '';
  });
}
function _dkBereich(name) {
  let b = window.__dkBereiche.get(name);
  if (!b) { b = {nummer: 0, angewandt: 0, offen: 0, letztes: Promise.resolve(), unklar: false, gescheitert: null, unterwegs: new Map()}; window.__dkBereiche.set(name, b); }
  return b;
}
function _dkNeuer(b, nr) {
  if (nr < b.angewandt) return false;
  b.angewandt = nr;
  return true;
}
function _dkFehler(text, art) {
  const e = new Error(text);
  e.dkBaustein = art;  // 'unklar' | 'nicht-gesendet' | 'abschluss'
  return e;
}
function zeitlimitSekunden() {
  // Seit 1.8.99 der einzige Weg zum Zeitlimit außerhalb des Bausteins (window.__dkZeitlimit setzen nur Klicktests, Festlegung 1.8.96
  // Nr. 13; tests/test_v404_vorweg.py).
  return Math.round(window.__dkZeitlimit / 1000);
}
function _dkUnklarText() {
  return `Keine Antwort vom Server nach ${zeitlimitSekunden()} Sekunden – unklar, ob gespeichert wurde. `
    + 'Bitte die Seite neu laden und prüfen.';
}
function _dkNichtGesendetText() {
  return 'Nicht gesendet: ein Speichern davor blieb ohne Antwort – unklar, ob es gespeichert wurde. Bitte die Seite neu laden und prüfen.';
}
function _dkHinweis(text) {
  // Oben auf der Seite, zusätzlich zur Meldung des Bereichs -- auch dort sichtbar, wo eine Seite einen Fehler nur knapp zeigt.
  if (typeof document === 'undefined' || !document.body) return;
  let el = document.getElementById('dkSpeichernUnklar');
  if (!el) {
    el = document.createElement('div');
    el.id = 'dkSpeichernUnklar';
    el.setAttribute('role', 'alert');
    el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:10000;display:flex;flex-wrap:wrap;align-items:center;gap:10px;'
      + 'padding:10px 16px;background:var(--danger-soft,#fdecea);color:var(--danger,#b42318);'
      + 'border-bottom:2px solid var(--danger,#b42318);font-weight:600;font-size:14px';
    const t = document.createElement('span');
    t.className = 'dk-text';
    const k = document.createElement('button');
    k.type = 'button';
    k.textContent = 'Seite neu laden';
    k.style.cssText = 'border:1px solid currentColor;background:transparent;color:inherit;padding:5px 10px;font:inherit;cursor:pointer';
    k.onclick = () => location.reload();
    el.append(t, k);
    document.body.appendChild(el);
  }
  el.querySelector('.dk-text').textContent = text;
}
/* Seit 1.8.103: läuft die Anmeldung ab, während die Seite offen ist (12 h, abgemeldet, Sitzungen beendet), antwortet die
   Anmeldeschranke auf das Speichern mit 401 und der Kopfzeile X-DK-Anmeldung: abgelaufen. Der Baustein erkennt sie an jeder Antwort
   eines Speicherns -- auch wo api() bei einem Fehler wirft -- und zeigt den Hinweis oben; der Bereich meldet den Text des Servers
   ("Anmeldung abgelaufen – …"), keine Weiterleitung, die Eingaben bleiben stehen. Nach dem Anmelden in einem neuen Tab gilt das neue
   Cookie auch hier: derselbe Klick speichert, und das gelungene Speichern nimmt den Hinweis weg. */
function _dkIstAbgelaufen(antwort) {
  return !!(antwort && antwort.status === 401 && antwort.headers && antwort.headers.get('X-DK-Anmeldung') === 'abgelaufen');
}
function _dkAbgelaufenPruefen(antwort) {
  if (_dkIstAbgelaufen(antwort)) _dkAnmeldungAbgelaufen(true);
  return antwort;
}
function _dkAnmeldungAbgelaufen(zeigen) {
  // Hinweis oben auf der Seite, solange das letzte Speichern an einer abgelaufenen Anmeldung scheiterte.
  if (typeof document === 'undefined' || !document.body) return;
  let el = document.getElementById('dkAnmeldungAbgelaufen');
  if (!zeigen) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div');
    el.id = 'dkAnmeldungAbgelaufen';
    el.setAttribute('role', 'alert');
    el.style.cssText = 'position:sticky;top:0;z-index:9999;padding:10px 16px;font-weight:600;font-size:14px;'
      + 'background:var(--warning-soft,#fef3c7);color:var(--warning,#92400e);border-bottom:2px solid var(--warning,#d97706)';
    el.textContent = 'Anmeldung abgelaufen – bitte in einem neuen Tab anmelden und danach hier erneut speichern. '
      + 'Die Eingaben auf dieser Seite bleiben stehen.';
    document.body.prepend(el);
  }
}
function _dkMitZeitlimit(laufend, kontrollen, b, uebertragen) {
  // Die Uhr läuft ab dem Ende der Übertragung (uebertragen): ohne Datei sofort beim Senden, beim Hochladen, wenn die Daten beim Server
  // sind (seit 1.8.99).
  let uhr, vorbei = false;
  const ablauf = new Promise((_, nein) => {
    Promise.resolve(uebertragen).then(() => {
      if (vorbei) return;
      uhr = setTimeout(() => {
        b.unklar = true;
        for (const k of kontrollen) k.abort();
        _dkHinweis(_dkUnklarText());
        nein(_dkFehler(_dkUnklarText(), 'unklar'));
      }, window.__dkZeitlimit);
    });
  });
  return Promise.race([laufend, ablauf]).finally(() => { vorbei = true; clearTimeout(uhr); });
}
function _dkHochladen(init) {
  // Hochladen = ein Body, der kein Text ist: FormData, Blob/File, ArrayBuffer oder eine Sicht darauf.
  const body = init && init.body;
  if (body == null || typeof body === 'string') return false;
  return (typeof FormData !== 'undefined' && body instanceof FormData) || (typeof Blob !== 'undefined' && body instanceof Blob)
    || (typeof ArrayBuffer !== 'undefined' && (body instanceof ArrayBuffer || ArrayBuffer.isView(body)));
}
function _dkPerXhr(input, init, uebertragen) {
  // Wie fetch(), aber über XMLHttpRequest: dessen upload-Ereignis loadend meldet das Ende der Übertragung (fetch kennt keins).
  // Ergebnis eine gewöhnliche Response; Netzfehler TypeError, Abbruch über das Signal AbortError -- wie bei fetch.
  return new Promise((ja, nein) => {
    const xhr = new XMLHttpRequest();
    let gemeldet = false;
    const ende = () => { if (!gemeldet) { gemeldet = true; uebertragen(); } };
    xhr.open(String((init && init.method) || 'GET').toUpperCase(), typeof input === 'string' ? input : (input && input.url) || String(input), true);
    if (init && init.headers) {
      const kopf = typeof Headers === 'function' ? new Headers(init.headers) : null;
      if (kopf) kopf.forEach((wert, name) => xhr.setRequestHeader(name, wert));
      else for (const [name, wert] of Object.entries(init.headers)) xhr.setRequestHeader(name, wert);
    }
    xhr.responseType = 'blob';
    if (xhr.upload && typeof xhr.upload.addEventListener === 'function') xhr.upload.addEventListener('loadend', ende);
    xhr.addEventListener('readystatechange', () => { if (xhr.readyState >= 2) ende(); });  // Antwortkopf da: übertragen
    xhr.addEventListener('load', () => {
      const kopf = new Headers();
      for (const zeile of String(xhr.getAllResponseHeaders() || '').trim().split(/[\r\n]+/)) {
        const i = zeile.indexOf(':');
        if (i > 0) kopf.append(zeile.slice(0, i).trim(), zeile.slice(i + 1).trim());
      }
      const ohneBody = [101, 204, 205, 304].includes(xhr.status);
      ja(new Response(ohneBody ? null : xhr.response, {status: xhr.status, statusText: xhr.statusText, headers: kopf}));
    });
    xhr.addEventListener('error', () => { ende(); nein(new TypeError('Failed to fetch')); });
    xhr.addEventListener('abort', () => { ende(); nein(new DOMException('The operation was aborted.', 'AbortError')); });
    const signal = init && init.signal;
    if (signal) {
      if (signal.aborted) { ende(); nein(new DOMException('The operation was aborted.', 'AbortError')); return; }
      signal.addEventListener('abort', () => xhr.abort());
    }
    xhr.send(init.body);
  });
}
async function lesen(bereich, anfrage, anwenden) {
  const b = _dkBereich(bereich);
  while (b.offen) await b.letztes;
  const nr = ++b.nummer;
  let daten;
  try {
    daten = await anfrage();
  } catch (e) {
    // Seit 1.8.97: ein veralteter Fehler wird verworfen wie ein veralteter Erfolg (false, keine Meldung); ein Fehler des neuesten
    // Lesens zählt wie eine angewandte Antwort -- ein älteres Lesen, das danach ankommt, wird verworfen (Lesen gegen Lesen).
    if (!_dkNeuer(b, nr)) return false;
    throw e;
  }
  if (!_dkNeuer(b, nr)) return false;
  if (anwenden) await anwenden(daten);
  return true;
}
function speichern(bereich, anfrage, optionen = {}) {
  return _dkSpeichern(bereich, anfrage, optionen, null);
}
function abschliessen(bereich, anfrage, optionen = {}) {
  for (const jetzt of [...(window.__dkEntprellt || [])]) {  // zurückgehaltene Eingaben (_debounce.html) jetzt speichern
    try { jetzt(); } catch (e) { console.error(e); }
  }
  const davor = [...window.__dkSpeichern];
  return _dkSpeichern(bereich, anfrage, optionen, async () => {
    await Promise.all(davor.map(s => s.ergebnis));
    if ([...window.__dkBereiche.values()].some(x => x.unklar)) {
      throw _dkFehler('Nicht ausgeführt: bei einem Speichern auf der Seite ist unklar, ob es gespeichert wurde. '
        + 'Bitte die Seite neu laden und prüfen.', 'abschluss');
    }
    // Seit 1.8.99: jeder Bereich, dessen letztes Speichern gescheitert ist (auch vor dem Klick) -- nicht eine abgelehnte
    // abschließende Aktion (die setzt gescheitert nicht).
    const gescheitert = [...window.__dkBereiche.values()].find(x => x.gescheitert !== null);
    if (gescheitert) {
      throw _dkFehler('Nicht ausgeführt: ein Speichern auf der Seite ist gescheitert'
        + (gescheitert.gescheitert ? ` (${gescheitert.gescheitert})` : '') + '. Bitte prüfen und erneut versuchen.', 'abschluss');
    }
    // Seit 1.8.109: ebenso, solange ein Zahlenfeld der Seite abgelehnt ist (_zahl.html markiert es mit aria-invalid) -- die
    // Eingabe ging nicht hinaus, gespeichert ist noch der alte Wert; eine Unterschrift o. ä. versiegelte ihn still.
    const abgelehnt = typeof document !== 'undefined' && document.querySelector
      ? document.querySelector('input[data-zahl][aria-invalid="true"]') : null;
    if (abgelehnt) {
      const feld = (abgelehnt.dataset && abgelehnt.dataset.feld) || '';
      throw _dkFehler('Nicht ausgeführt: eine Zahl auf der Seite ist ungültig' + (feld ? ` (${feld})` : '')
        + ' und nicht gespeichert. Bitte korrigieren und erneut versuchen.', 'abschluss');
    }
  });
}
function _dkSchluessel(ziel, angaben) {
  // Gleiche Anfrage = gleiche Methode, Adresse und Body als Text; ein anderer Body (FormData, Datei) ist nie gleich.
  const body = angaben && angaben.body;
  if (body != null && typeof body !== 'string') return null;
  const url = typeof ziel === 'string' ? ziel : (ziel && ziel.url) || String(ziel);
  return String((angaben && angaben.method) || 'GET').toUpperCase() + ' ' + url + ' ' + (body || '');
}
function _dkSpeichern(bereich, anfrage, optionen, voraussetzung) {
  const b = _dkBereich(bereich);
  // Die Anfrage wird JETZT gebaut -- URL und Body samt der Werte aus dem Formular, wie sie beim Klick stehen --, hinaus geht sie
  // erst, wenn das vorige Speichern des Bereichs zurück ist: fetch() ist während des Aufrufs von anfrage() durch eine Fassung
  // ersetzt, die bis zur Freigabe wartet. Sonst läse eine wartende Anfrage ein Formular, das die Antwort des vorigen Speicherns
  // inzwischen neu gezeichnet hat, und schickte still den alten Stand. Dieselbe Fassung gibt jeder Anfrage ein Abbruchsignal für
  // das Zeitlimit mit.
  let senden, nichtSenden, gebaut = 0, schluessel = null;
  const freigabe = new Promise((ja, nein) => { senden = ja; nichtSenden = nein; });
  freigabe.catch(() => {});
  const kontrollen = [], uebertragungen = [];
  const echtesFetch = window.fetch;
  let laufend;
  try {
    window.fetch = function (input, init) {
      gebaut++;
      schluessel = gebaut === 1 ? _dkSchluessel(input, init) : null;
      if (typeof AbortController === 'function' && !(init && init.signal)) {
        const k = new AbortController();
        kontrollen.push(k);
        init = Object.assign({}, init, {signal: k.signal});
      }
      let uebertragen;
      uebertragungen.push(new Promise(r => { uebertragen = r; }));
      const self = this;
      return freigabe.then(() => {
        if (_dkHochladen(init) && typeof XMLHttpRequest === 'function') return _dkPerXhr(input, init, uebertragen);
        uebertragen();  // ohne Datei: das Zeitlimit läuft ab dem Senden
        return echtesFetch.call(self, input, init);
      }).then(_dkAbgelaufenPruefen);
    };
    try { laufend = Promise.resolve(anfrage()); } finally { window.fetch = echtesFetch; }
    if (!gebaut) console.error(`speichern('${bereich}'): die Anfrage ging nicht sofort über fetch() -- sie wartet nicht auf das vorige Speichern`);
  } catch (e) {
    laufend = Promise.reject(e);
  }
  laufend.catch(() => {});  // der Fehler kommt unten an; bis dahin nicht als unbehandelt melden
  // Seit 1.8.97: dieselbe Anfrage noch einmal (Doppelklick), während die erste im Bereich wartet oder unterwegs ist, geht nicht ein
  // zweites Mal hinaus und wartet nicht -- sie bekommt das Ergebnis der ersten (eine fetch-Antwort als eigene Kopie). Sonst hielte
  // nach "Anmelden" oder "… erstellen" die eingereihte zweite die Weiterleitung mit der Warnung beim Verlassen auf, und eine Aktion
  // liefe zweimal.
  const erste = schluessel === null ? null : b.unterwegs.get(schluessel);
  if (erste) {
    nichtSenden(_dkFehler('doppelt', 'doppelt'));
    return erste.versprechen.then(d => (erste.kopie && typeof Response !== 'undefined' && d instanceof Response) ? erste.kopie.clone() : d);
  }
  const eintrag = {bereich, schluessel};
  eintrag.versprechen = _dkSenden(b, eintrag, laufend, kontrollen, senden, nichtSenden, optionen, voraussetzung,
                                  Promise.all(uebertragungen));
  return eintrag.versprechen;
}
async function _dkSenden(b, eintrag, laufend, kontrollen, senden, nichtSenden, optionen, voraussetzung, uebertragen) {
  const vorher = b.letztes;
  let fertig, melden;
  b.letztes = new Promise(r => { fertig = r; });
  b.offen++;
  eintrag.ergebnis = new Promise(r => { melden = r; });
  window.__dkSpeichern.add(eintrag);
  if (eintrag.schluessel !== null) b.unterwegs.set(eintrag.schluessel, eintrag);
  let daten, nr, ergebnis = {ok: false, fehler: ''};
  try {
    await vorher;
    if (voraussetzung) await voraussetzung();
    if (b.unklar) throw _dkFehler(_dkNichtGesendetText(), 'nicht-gesendet');
    nr = ++b.nummer;
    senden();
    daten = await _dkMitZeitlimit(laufend, kontrollen, b, uebertragen);
    const istAntwort = typeof Response !== 'undefined' && daten instanceof Response;
    if (istAntwort) eintrag.kopie = daten.clone();  // für eine gleiche zweite Anfrage, bevor der Aufrufer den Body liest
    const fehlstatus = istAntwort && !daten.ok;
    ergebnis = {ok: !fehlstatus, fehler: fehlstatus ? (_dkIstAbgelaufen(daten) ? 'Anmeldung abgelaufen' : `Status ${daten.status}`) : ''};
    if (ergebnis.ok) _dkAnmeldungAbgelaufen(false);  // nach dem Anmelden in einem neuen Tab gelungen: Hinweis weg
  } catch (e) {
    nichtSenden(e);  // noch nicht gesendet (Voraussetzung, unklarer Bereich): die gebaute Anfrage geht nie hinaus
    ergebnis = {ok: false, fehler: e && e.message ? e.message : String(e)};
    throw e;
  } finally {
    // Seit 1.8.99: ein gescheitertes Speichern merkt sich der Bereich, bis ein späteres gelingt -- abschließende Aktionen der Seite
    // gehen bis dahin nicht hinaus. Nur für speichern() (ohne Voraussetzung), nicht für abschliessen().
    if (!voraussetzung) b.gescheitert = ergebnis.ok ? null : (ergebnis.fehler || 'Fehler');
    b.offen--;
    window.__dkSpeichern.delete(eintrag);
    if (eintrag.schluessel !== null && b.unterwegs.get(eintrag.schluessel) === eintrag) b.unterwegs.delete(eintrag.schluessel);
    melden(ergebnis);
    fertig();
  }
  if (!ergebnis.ok) return daten;
  if (optionen.anwenden && _dkNeuer(b, nr)) await optionen.anwenden(daten);
  if (optionen.neuLaden) await optionen.neuLaden();
  return daten;
}
</script>

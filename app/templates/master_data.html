<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DACHKONZEPTE ERP – Stammdaten</title>
<script>(function(){try{var t=localStorage.getItem('erp_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--accent:{{ get_theme().accent_color }};--bg:#f4f6f5;--card:#fff;--ink:#182420;--muted:#5c6f68;--line:#dde5e1;--field-border:#b9c4bd;--field-border-hover:#8fa098;--soft:#eef5f3;--sidebar-bg:#fbfdfc;--sidebar-text:#223028;--sidebar-text-dim:rgba(34,48,40,.7);--sidebar-border:#e2e8e5;--sidebar-hover:color-mix(in srgb,var(--accent) 8%,var(--sidebar-bg));--sidebar-active-bg:color-mix(in srgb,var(--accent) 12%,var(--sidebar-bg));--sidebar-active-text:var(--accent);--sidebar-active-border:var(--accent);color:var(--ink)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121816;--card:#1a2220;--ink:#e7ece8;--muted:#94a49c;--line:#2b3532;--field-border:#3a4642;--field-border-hover:#4d5b56;--soft:#1e2b26;--sidebar-bg:#0e1513;--sidebar-text:#e7ece8;--sidebar-text-dim:rgba(231,236,232,.68);--sidebar-border:rgba(255,255,255,.09);--sidebar-hover:color-mix(in srgb,var(--accent) 16%,var(--sidebar-bg));--sidebar-active-bg:color-mix(in srgb,var(--accent) 22%,var(--sidebar-bg))}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}main{max-width:1500px;margin:0;padding:20px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px}.side{background:var(--card);border:1px solid var(--line);padding:12px;align-self:start;position:sticky;top:18px}.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 9px}.side button{display:block;width:100%;border:0;border-left:2px solid transparent;background:transparent;text-align:left;padding:10px 11px;font:inherit;font-weight:650;color:var(--ink);cursor:pointer}.side button:hover{background:var(--soft)}.side button.active{background:var(--accent);color:#fff;border-left-color:var(--accent)}.card{background:var(--card);border:1px solid var(--line);padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{font-size:22px;margin:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{padding:9px 11px;border:1px solid var(--field-border);background:var(--card);color:var(--ink);min-width:260px;font:inherit}input:hover{border-color:var(--field-border-hover)}input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}.add{background:var(--accent);color:#fff;text-decoration:none;padding:10px 14px;font-weight:650;border:1px solid var(--accent)}.add:hover{background:color-mix(in srgb,var(--accent) 85%,black)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--card);position:sticky;top:0;font-weight:700}tbody tr:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}.wrap{overflow:auto;max-height:70vh}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-block;padding:3px 8px;background:var(--soft);border:1px solid var(--line);font-size:10.5px}.link{color:var(--accent);font-weight:650;text-decoration:none}.empty{padding:40px;text-align:center;color:var(--muted)}.metric{background:var(--soft);border:1px solid var(--line);padding:13px;min-width:145px}.metric b{font-size:20px;display:block;color:var(--ink)}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side h3{display:none}.side button{white-space:nowrap}.head{align-items:flex-start;flex-direction:column}input{min-width:0;width:100%}}
</style></head><body>
<div class="app-layout">
{% include "_sidebar.html" %}
<div class="app-content">
{% include "_topbar.html" %}
<main><div class="layout">
<aside class="side"><h3>Stammdaten</h3><button data-view="customers" onclick="showView('customers')">Kunden</button><button data-view="properties" onclick="showView('properties')">Objekte</button><button data-view="employees" onclick="showView('employees')">Mitarbeiter</button><button data-view="teams" onclick="showView('teams')">Kolonnen / Teams</button><button data-view="assets" onclick="showView('assets')">{{ 'Betriebsmittel' if is_module_enabled('betriebsmittel') else 'Fuhrpark & Maschinen' }}</button><button data-view="suppliers" onclick="showView('suppliers')">Lieferanten</button><button data-view="catalogs" onclick="showView('catalogs')">Leistungskataloge</button><button data-view="materialGroups" onclick="showView('materialGroups')">Materialkataloge</button></aside>
<section class="card"><div class="head"><div><h1 id="title">Stammdaten</h1><div id="subtitle" class="muted small"></div></div><div class="toolbar"><input id="search" placeholder="Suchen …" oninput="render()"><a id="addLink" class="add" href="#">+ Hinzufügen</a></div></div><div id="content"></div></section>
</div></main>
</div>
</div>
<script>
let customers=[],properties=[],employees=[],services=[],suppliers=[],resources=[],teams=[],catalogs=[],materials=[],materialGroups=[],assets=[];let current='customers';
const bmModuleEnabled={{ 'true' if is_module_enabled('betriebsmittel') else 'false' }};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(u,o){const r=await fetch(u,o);if(!r.ok)throw Error((await r.json().catch(()=>({detail:r.statusText}))).detail||r.statusText);return r.json()}
const materialCatalogFilter=new URLSearchParams(location.search).get('catalog_id')?Number(new URLSearchParams(location.search).get('catalog_id')):null;
function viewFromHash(){const x=location.hash.replace('#','');return ['customers','properties','employees','teams','assets','suppliers','catalogs','materials','materialGroups'].includes(x)?x:'customers'}
function fmtDate(s){if(!s)return'';return new Date(s.length>10?s:s+'T00:00:00').toLocaleDateString('de-DE')}
function showView(v,push=true){current=v;if(push)history.replaceState(null,'','#'+v);document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('search').value='';render()}
function customerName(id){return customers.find(c=>c.id===id)?.name||'—'}
function materialGroupName(id){return materialGroups.find(g=>g.id===id)?.name||'—'}
function money(x){return x==null?'—':Number(x).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function textMatch(...vals){const q=document.getElementById('search').value.trim().toLowerCase();return !q||vals.some(v=>String(v??'').toLowerCase().includes(q))}
function table(headers,rows){return `<div class="wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">Keine Einträge gefunden.</td></tr>`}</tbody></table></div>`}
function render(){const title=document.getElementById('title'),sub=document.getElementById('subtitle'),add=document.getElementById('addLink'),c=document.getElementById('content');
 if(current==='customers'){title.textContent='Kunden';sub.textContent=`${customers.length} Kundenstammsätze`;add.style.display='inline-block';add.href='/master-data/customers/new';let rows=customers.filter(x=>textMatch(x.customer_number,x.name,x.category,x.city,x.phone,x.email)).map(x=>`<tr><td><b>${esc(x.customer_number)}</b></td><td><a class="link" href="/customers/${x.id}">${esc(x.name)}</a>${x.contact_person?`<div class="muted small">${esc(x.contact_person)}</div>`:''}</td><td><span class="pill">${esc(x.category)}</span></td><td>${esc(x.city||'—')}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td><a class="link" href="/customers/${x.id}">Öffnen</a></td></tr>`);c.innerHTML=table(['Kundennr.','Kunde','Kategorie','Ort','Telefon','E-Mail',''],rows)}
 else if(current==='properties'){title.textContent='Objekte';let showPrimary=document.getElementById('showPrimaryAddresses')?.checked||false;let searching=document.getElementById('search').value.trim().length>0;let matched=properties.filter(x=>textMatch(x.name,x.street,x.postal_code,x.city,customerName(x.customer_id)));let visible=matched.filter(x=>showPrimary||searching||!x.is_primary_address);sub.textContent=`${properties.filter(x=>!x.is_primary_address).length} Objekte (ohne Hauptadressen)`;add.style.display='inline-block';add.href='/master-data/properties/new';let rows=visible.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.is_primary_address?' <span class="pill">Hauptadresse</span>':''}</td><td>${esc(customerName(x.customer_id))}</td><td>${esc(x.street||'—')}</td><td>${esc((x.postal_code||'')+' '+(x.city||''))}</td><td>${esc(x.notes||'')}</td><td><a class="link" href="/properties/${x.id}">Öffnen</a></td></tr>`);c.innerHTML=`<label style="display:flex;gap:7px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)"><input type="checkbox" id="showPrimaryAddresses" style="width:auto" onchange="render()" ${showPrimary?'checked':''}> Hauptadressen anzeigen</label>`+table(['Objekt','Kunde','Straße','PLZ / Ort','Hinweis',''],rows)}
 else if(current==='employees'){const commercial=employees.filter(e=>e.active&&e.cost_allocation==='labor_rate');const weight=commercial.reduce((a,e)=>a+Number(e.weekly_hours||0),0);const mean=weight?commercial.reduce((a,e)=>a+Number(e.effective_hourly_wage||0)*Number(e.weekly_hours||0),0)/weight:null;const varCount=employees.filter(e=>e.active&&e.cost_allocation==='variable_overhead').length;title.textContent='Mitarbeiter';sub.textContent=`${employees.length} Mitarbeiterstammsätze`;add.style.display='inline-block';add.href='/master-data/employees/new';let rows=employees.filter(x=>textMatch(x.employee_number,x.first_name,x.last_name,x.function_name,x.email,x.phone,x.mobile)).map(x=>`<tr><td>${esc(x.employee_number||'—')}</td><td><b>${esc(x.first_name)} ${esc(x.last_name)}</b>${x.birthday?`<div class="muted small">Geb. ${new Date(x.birthday+'T00:00:00').toLocaleDateString('de-DE')}</div>`:''}</td><td>${esc(x.function_name||x.job_title||'—')}<div class="muted small">${x.employee_group==='gewerblich'?'Gewerblich':'Kaufmännisch'}</div></td><td>${[x.mobile||x.phone,x.email].filter(Boolean).map(esc).join('<br>')||'—'}</td><td class="number">${Number(x.weekly_hours).toLocaleString('de-DE')}</td><td class="number">${x.compensation_type==='fixed_salary'?`${money(x.monthly_salary)}/Monat<div class="muted small">≈ ${money(x.effective_hourly_wage)}/h</div>`:money(x.effective_hourly_wage)+'/h'}</td><td>${x.cost_allocation==='labor_rate'?'Verrechnungssatz':x.cost_allocation==='variable_overhead'?'Variable GK':'Nicht berücksichtigt'}</td><td>${x.available_as_caseworker?'<span class="pill">Ja</span>':'—'}</td><td>${x.show_on_planning_board?'<span class="pill">Plantafel</span>':'—'}</td><td><span class="pill">${x.active?'Aktiv':'Inaktiv'}</span></td><td><a class="link" href="/master-data/employees/${x.id}/edit">Bearbeiten</a></td></tr>`);c.innerHTML=`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px"><div class="metric"><div class="muted small">MA im Verrechnungssatz</div><b>${commercial.length}</b></div><div class="metric"><div class="muted small">Gewichteter Mittellohn</div><b>${mean==null?'—':money(mean)+'/h'}</b></div><div class="metric"><div class="muted small">MA in variablen GK</div><b>${varCount}</b></div></div>`+table(['Nr.','Mitarbeiter','Funktion','Kontakt','Std./Woche','Vergütung','Kosten-Zuordnung','Sachbearbeiter','Planung','Status',''],rows)}
 else if(current==='teams'){title.textContent='Kolonnen / Teams';sub.textContent=`${teams.length} definierte Teams für AV und spätere Planungstafel`;add.style.display='inline-block';add.href='/master-data/teams/new';let rows=teams.filter(x=>textMatch(x.team_number,x.name,x.description,...x.employees.map(e=>e.employee_name),...x.resources.map(r=>r.resource_name))).map(x=>`<tr><td>${esc(x.team_number||'—')}</td><td><b>${esc(x.name)}</b><div class="muted small">${esc(x.description||'')}</div></td><td>${x.employees.map(e=>`<span class="pill">${esc(e.employee_name)}</span>`).join(' ')||'—'}</td><td>${x.resources.map(r=>`<span class="pill">${esc(r.resource_type)} · ${esc(r.resource_name)}</span>`).join(' ')||'—'}</td><td><span class="pill">${x.active?'Aktiv':'Inaktiv'}</span></td><td><a class="link" href="/master-data/teams/${x.id}/edit">Bearbeiten</a></td></tr>`);c.innerHTML=table(['Nr.','Kolonne / Team','Mitarbeiter','Fuhrpark / Maschinen','Status',''],rows)}
 else if(current==='assets'&&bmModuleEnabled){title.textContent='Betriebsmittel';sub.textContent=`${assets.length} inventarisierte Betriebsmittel`;add.style.display='inline-block';add.href='/master-data/assets/new';let due=assets.filter(x=>x.is_due||x.is_overdue);let panel=due.length?`<div class="metric" style="margin-bottom:16px;max-width:100%"><div class="muted small">Fällige Prüffristen</div><b>${due.length}</b><div class="muted small" style="margin-top:6px">${due.map(x=>`<a class="link" href="/betriebsmittel/${x.id}">${esc(x.name)}</a>${x.is_overdue?' (überfällig)':' (fällig)'}`).join(', ')}</div></div>`:'';let rows=assets.filter(x=>textMatch(x.asset_number,x.name,x.asset_type)).map(x=>{let badge=x.is_overdue?'<span class="pill" style="background:#fbeae8">⚠ überfällig</span>':x.is_due?'<span class="pill">fällig</span>':'—';return `<tr><td>${esc(x.asset_number||'—')}</td><td><span class="pill">${esc(x.asset_type||'—')}</span></td><td><b>${esc(x.name)}</b>${x.resource_id?' <span class="pill">Ressourcenbezug</span>':''}</td><td>${fmtDate(x.next_due_date)} ${badge}</td><td><span class="pill">${x.active?'Aktiv':'Inaktiv'}</span></td><td><a class="link" href="/betriebsmittel/${x.id}">Öffnen</a></td></tr>`});c.innerHTML=panel+table(['Nr.','Typ','Betriebsmittel','Nächste Prüffrist','Status',''],rows)}
 else if(current==='assets'){title.textContent='Fuhrpark & Maschinen';sub.textContent=`${resources.length} planbare Ressourcen`;add.style.display='inline-block';add.href='/master-data/resources/new';let rows=resources.filter(x=>textMatch(x.resource_number,x.resource_type,x.name,x.manufacturer,x.model,x.identifier)).map(x=>`<tr><td>${esc(x.resource_number||'—')}</td><td><span class="pill">${esc(x.resource_type)}</span></td><td><b>${esc(x.name)}</b></td><td>${esc([x.manufacturer,x.model].filter(Boolean).join(' ')||'—')}</td><td>${esc(x.identifier||'—')}</td><td><span class="pill">${x.active?'Aktiv':'Inaktiv'}</span></td><td><a class="link" href="/master-data/resources/${x.id}/edit">Bearbeiten</a></td></tr>`);c.innerHTML=table(['Nr.','Typ','Ressource','Hersteller / Modell','Kennzeichen / Seriennr.','Status',''],rows)}
 else if(current==='suppliers'){title.textContent='Lieferanten';sub.textContent=`${suppliers.length} Lieferantenstammsätze`;add.style.display='inline-block';add.href='/master-data/suppliers/new';let rows=suppliers.filter(x=>textMatch(x.supplier_number,x.name,x.contact_person,x.city,x.email,x.phone)).map(x=>`<tr><td>${esc(x.supplier_number||'—')}</td><td><b>${esc(x.name)}</b><div class="muted small">${esc(x.contact_person||'')}</div></td><td>${esc(x.city||'—')}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.customer_number_at_supplier||'—')}</td><td><span class="pill">${x.active?'Aktiv':'Inaktiv'}</span></td><td><a class="link" href="/master-data/suppliers/${x.id}/edit">Bearbeiten</a></td></tr>`);c.innerHTML=table(['Lieferantennr.','Lieferant','Ort','Telefon','E-Mail','Unsere Kundennr.','Status',''],rows)}
 else if(current==='catalogs'){title.textContent='Leistungskataloge';sub.innerHTML=`${catalogs.filter(x=>!x.archived).length} aktive Leistungskataloge · <a class="link" href="/leistungskatalog">Leistungen durchsuchen / XML importieren</a>`;add.style.display='inline-block';add.href='/master-data/catalogs/new';let showArchived=document.getElementById('showArchivedCatalogs')?.checked||false;let rows=catalogs.filter(x=>showArchived||!x.archived).filter(x=>textMatch(x.name,x.description)).map(x=>`<tr><td><b>${esc(x.name)}</b>${x.is_import_catalog?'<div class="muted small">Fertigkatalog · nimmt Importe automatisch auf</div>':''}</td><td>${esc(x.description||'—')}</td><td><span class="pill">${x.archived?'Archiviert':'Aktiv'}</span></td><td><a class="link" href="/leistungskatalog?catalog_id=${x.id}">Leistungen ansehen</a></td><td>${x.is_import_catalog?'<span class="muted small">Kann nicht archiviert werden</span>':x.archived?`<a class="link" href="#" onclick="unarchiveCatalog(${x.id});return false">Wiederherstellen</a>`:`<a class="link" href="#" onclick="archiveCatalog(${x.id});return false">Archivieren</a>`}</td></tr>`);c.innerHTML=`<label style="display:flex;gap:7px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)"><input type="checkbox" id="showArchivedCatalogs" style="width:auto" onchange="render()" ${showArchived?'checked':''}> Archivierte auch anzeigen</label>`+table(['Leistungskatalog','Beschreibung','Status','Leistungen',''],rows)}
 else if(current==='materials'){const activeGroups=materialGroups.filter(g=>!g.archived);const catalogOptions='<option value="">Zielkatalog wählen …</option>'+activeGroups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');if(materialCatalogFilter){const grp=materialGroups.find(g=>g.id===materialCatalogFilter);title.textContent=grp?`Materialkatalog: ${grp.name}`:'Materialien';sub.innerHTML=`${materials.length} Materialien in diesem Katalog · <a class="link" href="/master-data#materials">alle Materialien anzeigen</a>`}else{title.textContent='Materialien';sub.textContent=`${materials.length} Materialien gesamt`}add.style.display='inline-block';add.href=materialCatalogFilter?`/master-data/materials/new?catalog_id=${materialCatalogFilter}`:'/master-data/materials/new';let rows=materials.filter(x=>textMatch(x.article_number,x.name)).map(x=>`<tr><td>${esc(x.article_number||'—')}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.unit)}</td><td class="number">${Number(x.purchase_price).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})} €</td><td>${Number(x.price_basis)!==1?esc(String(x.price_basis)):'—'}</td><td><span class="pill">${x.source==='manual'?'Eigenes':'Importiert'}</span></td><td>${esc(materialGroupName(x.catalog_id))}</td><td><a class="link" href="/master-data/materials/${x.id}/edit">Bearbeiten</a></td><td><select data-material-id="${x.id}" style="width:auto;font-size:12px;padding:3px 5px;margin-bottom:3px">${catalogOptions}</select><br><button onclick="moveOrCopyMaterial(${x.id},'move')" style="font-size:11px;padding:4px 7px;margin-right:4px">Verschieben</button><button class="secondary" onclick="moveOrCopyMaterial(${x.id},'copy')" style="font-size:11px;padding:4px 7px">Kopieren</button></td></tr>`);c.innerHTML=table(['Artikelnr.','Name','Einheit','Einkaufspreis','Preisbasis','Herkunft','Katalog','','Verschieben / Kopieren'],rows)}
 else if(current==='materialGroups'){title.textContent='Materialkataloge';sub.textContent=`${materialGroups.filter(x=>!x.archived).length} aktive Materialkataloge`;add.style.display='inline-block';add.href='/master-data/materialGroups/new';let showArchived=document.getElementById('showArchivedMaterialGroups')?.checked||false;let rows=materialGroups.filter(x=>showArchived||!x.archived).filter(x=>textMatch(x.name,x.description)).map(x=>`<tr><td><b>${esc(x.name)}</b>${x.is_import_catalog?'<div class="muted small">Fertigkatalog · nimmt Importe automatisch auf</div>':''}</td><td>${esc(x.description||'—')}</td><td><span class="pill">${x.archived?'Archiviert':'Aktiv'}</span></td><td><a class="link" href="/master-data?catalog_id=${x.id}#materials">Materialien ansehen</a></td><td>${x.is_import_catalog?'<span class="muted small">Kann nicht archiviert werden</span>':x.archived?`<a class="link" href="#" onclick="unarchiveMaterialGroup(${x.id});return false">Wiederherstellen</a>`:`<a class="link" href="#" onclick="archiveMaterialGroup(${x.id});return false">Archivieren</a>`}</td></tr>`);c.innerHTML=`<label style="display:flex;gap:7px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)"><input type="checkbox" id="showArchivedMaterialGroups" style="width:auto" onchange="render()" ${showArchived?'checked':''}> Archivierte auch anzeigen</label>`+table(['Katalog','Beschreibung','Status','Materialien',''],rows)}
}
async function archiveCatalog(id){if(!confirm('Katalog archivieren?'))return;try{await api('/api/catalogs/'+id+'/archive',{method:'POST'});catalogs=await api('/api/catalogs?include_archived=true');render()}catch(e){alert('Fehler: '+e.message)}}
async function unarchiveCatalog(id){try{await api('/api/catalogs/'+id+'/unarchive',{method:'POST'});catalogs=await api('/api/catalogs?include_archived=true');render()}catch(e){alert('Fehler: '+e.message)}}
async function archiveMaterialGroup(id){if(!confirm('Materialkatalog archivieren?'))return;try{await api('/api/material-groups/'+id+'/archive',{method:'POST'});materialGroups=await api('/api/material-groups?include_archived=true');render()}catch(e){alert('Fehler: '+e.message)}}
async function unarchiveMaterialGroup(id){try{await api('/api/material-groups/'+id+'/unarchive',{method:'POST'});materialGroups=await api('/api/material-groups?include_archived=true');render()}catch(e){alert('Fehler: '+e.message)}}
async function moveOrCopyMaterial(materialId,action){const select=document.querySelector(`select[data-material-id="${materialId}"]`);const targetGroupId=select&&select.value?Number(select.value):null;if(!targetGroupId){alert('Bitte einen Zielkatalog auswählen.');return}try{await api(`/api/materials/${materialId}/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({catalog_id:targetGroupId})});materials=await api(materialCatalogFilter?`/api/materials?catalog_id=${materialCatalogFilter}`:'/api/materials');render()}catch(e){alert('Fehler: '+e.message)}}

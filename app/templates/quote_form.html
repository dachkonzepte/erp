<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DACHKONZEPTE ERP – Angebot anlegen</title>
<script>(function(){try{var t=localStorage.getItem('erp_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
{% include "_ds_kopf.html" %}
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;color:var(--ink);background:var(--bg)}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.topnav{max-width:900px;margin:24px auto 0;padding:0 22px}.back{color:var(--accent);text-decoration:none;font-weight:700}.wrap{max-width:900px;margin:12px auto 24px;background:var(--card);border:1px solid var(--line);padding:22px}.field{margin-bottom:13px}label{display:block;font-size:12px;font-weight:650;margin-bottom:5px;color:var(--muted)}input,select{width:100%;padding:10px;border:1px solid var(--field-border);background:var(--card);color:var(--ink);font:inherit}input:hover,select:hover{border-color:var(--field-border-hover)}input:focus,select:focus{outline:2px solid var(--ds-aktion);outline-offset:-1px;border-color:var(--ds-aktion)}button{background:var(--ds-aktion);color:#fff;border:1px solid var(--ds-aktion);padding:11px 16px;font-weight:650;cursor:pointer}button:hover{background:color-mix(in srgb,var(--ds-aktion) 85%,black);border-color:color-mix(in srgb,var(--ds-aktion) 85%,black)}.muted{color:var(--muted);font-size:12px}h1{color:var(--ink)}
</style></head><body><div class="topnav"><a class="back" href="{{ zurueck.href }}">← {{ zurueck.text }}</a></div><div class="wrap"><h1>Neues Angebot</h1><p class="muted">Das Angebot wird einem bestehenden Projekt zugeordnet und anschließend im LV-Editor geöffnet.</p><div class="field"><label>Projekt *</label><select id="project"></select></div><div class="field"><label>Bezeichnung *</label><input id="title" value="Angebot"></div><div class="field"><label>Umsatzsteuer %</label><input id="vat" type="text" inputmode="decimal" data-zahl value="19"></div><button onclick="save()">Angebot anlegen & öffnen</button><span id="msg" class="muted"></span></div>{% include "_speichern.html" %}{% include "_zahl.html" %}<script>/* seit 1.8.102 über esc(): Projektnummer, Kunde und Projektname gingen ungeschützt in die Auswahl (Befund 1.8.100 Nr. 6) */const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async(u,o)=>{const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||r.statusText);return d};/* seit 1.8.97 über lesen() (_speichern.html), Bereich 'angebot' wie das Anlegen */async function load(){await lesen('angebot',()=>Promise.all([api('/api/projects'),api('/api/settings/general')]),([ps,g])=>{document.getElementById('project').innerHTML=ps.map(p=>`<option value="${p.id}">${esc(p.project_number)} · ${esc(p.customer_name)} · ${esc(p.name)}</option>`).join('');document.getElementById('vat').value=zahlText(g.default_vat_rate||19);let id=new URLSearchParams(location.search).get('project_id');if(id)document.getElementById('project').value=id})}/* seit 1.8.109: Umsatzsteuer über zahlFeld() (_zahl.html, deutsches Format), gelesen vor dem Speichern */async function save(){try{const vat=zahlFeld('vat',{leer:19});let d=await speichern('angebot',()=>api(`/api/projects/${document.getElementById('project').value}/quotes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('title').value.trim(),vat_rate:vat,intro_text:null,outro_text:null})}));location.href='/quotes/'+d.id+'/edit'}catch(e){document.getElementById('msg').textContent='Fehler: '+e.message}}load()</script></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DACHKONZEPTE ERP – Projekte & Belege</title>
<script>(function(){try{var t=localStorage.getItem('erp_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--accent:{{ get_theme().accent_color }};--bg:#f4f6f5;--card:#fff;--ink:#182420;--muted:#5c6f68;--line:#dde5e1;--field-border:#b9c4bd;--field-border-hover:#8fa098;--soft:#eef5f3;--sidebar-bg:#fbfdfc;--sidebar-text:#223028;--sidebar-text-dim:rgba(34,48,40,.7);--sidebar-border:#e2e8e5;--sidebar-hover:color-mix(in srgb,var(--accent) 8%,var(--sidebar-bg));--sidebar-active-bg:color-mix(in srgb,var(--accent) 12%,var(--sidebar-bg));--sidebar-active-text:var(--accent);--sidebar-active-border:var(--accent);color:var(--ink)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121816;--card:#1a2220;--ink:#e7ece8;--muted:#94a49c;--line:#2b3532;--field-border:#3a4642;--field-border-hover:#4d5b56;--soft:#1e2b26;--sidebar-bg:#0e1513;--sidebar-text:#e7ece8;--sidebar-text-dim:rgba(231,236,232,.68);--sidebar-border:rgba(255,255,255,.09);--sidebar-hover:color-mix(in srgb,var(--accent) 16%,var(--sidebar-bg));--sidebar-active-bg:color-mix(in srgb,var(--accent) 22%,var(--sidebar-bg))}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}main{max-width:1500px;margin:0;padding:20px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px}.side{background:var(--card);border:1px solid var(--line);padding:12px;align-self:start;position:sticky;top:18px}.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 9px}.side button{display:block;width:100%;border:0;border-left:2px solid transparent;background:transparent;text-align:left;padding:10px 11px;font:inherit;font-weight:650;color:var(--ink);cursor:pointer}.side button:hover{background:var(--soft)}.side button.active{background:var(--accent);color:#fff;border-left-color:var(--accent)}.badge{float:right;font-size:10px;background:var(--soft);border:1px solid var(--line);padding:2px 7px}.side button.active .badge{background:rgba(255,255,255,.25);border-color:transparent;color:#fff}.card{background:var(--card);border:1px solid var(--line);padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{font-size:22px;margin:0;color:var(--ink)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select{padding:9px 11px;border:1px solid var(--field-border);background:var(--card);color:var(--ink);font:inherit}input:hover,select:hover{border-color:var(--field-border-hover)}input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}.search{min-width:280px}.add{background:var(--accent);color:#fff;text-decoration:none;padding:10px 14px;font-weight:650;border:1px solid var(--accent)}.add:hover{background:color-mix(in srgb,var(--accent) 85%,black)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--card);font-weight:700}tbody tr:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}.wrap{overflow:auto;max-height:70vh}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-block;padding:2px 8px;background:var(--soft);border:1px solid var(--line);font-size:10.5px}.link{color:var(--accent);font-weight:650;text-decoration:none}.number{text-align:right}.empty{padding:45px;text-align:center;color:var(--muted)}.placeholder{border:1px dashed var(--field-border);background:var(--soft);padding:45px;text-align:center}.placeholder h2{margin-top:0;color:var(--ink)}.metric-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.metric{background:var(--soft);border:1px solid var(--line);padding:11px 14px;min-width:150px}.metric b{display:block;font-size:19px;color:var(--ink)}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side h3{display:none}.side button{white-space:nowrap}.head{flex-direction:column;align-items:flex-start}.search{min-width:0;width:100%}}
</style></head><body>
<div class="app-layout">
{% include "_sidebar.html" %}
<div class="app-content">
{% include "_topbar.html" %}
<main><div class="layout"><aside class="side"><h3>Projekte & Vorgänge</h3><button data-view="projects" onclick="showView('projects')">Projekte <span id="nProjects" class="badge"></span></button><button data-view="quotes" onclick="showView('quotes')">Angebote <span id="nQuotes" class="badge"></span></button><button data-view="orders" onclick="showView('orders')">Aufträge <span id="nOrders" class="badge"></span></button><button data-view="inquiries" onclick="showView('inquiries')">Anfragen <span id="nInquiries" class="badge"></span></button><button data-view="templates" onclick="showView('templates')">Mustervorgänge <span id="nTemplates" class="badge"></span></button></aside>
<section class="card"><div class="head"><div><h1 id="title">Projekte</h1><div id="subtitle" class="muted small"></div></div><div class="toolbar"><input id="search" class="search" placeholder="Suchen …" oninput="render()"><label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--ink)"><input type="checkbox" id="showArchived" style="width:auto" onchange="render()"> Archivierte anzeigen</label><a id="addLink" class="add" href="/projects/new">+ Projekt</a></div></div><div id="content"></div></section></div></main>
</div>
</div>
<script>
let projects=[],quotes=[],orders=[],inquiries=[],templates=[];let current='projects';const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=x=>Number(x||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
async function api(u,opts){const r=await fetch(u,opts);if(!r.ok)throw Error((await r.json().catch(()=>({detail:r.statusText}))).detail||r.statusText);return r.json()}
function fromHash(){const x=location.hash.replace('#','');return ['projects','quotes','orders','inquiries','templates'].includes(x)?x:'projects'}function showView(v,push=true){current=v;if(push)history.replaceState(null,'','#'+v);document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('search').value='';render()}
function match(...v){const q=document.getElementById('search').value.trim().toLowerCase();return !q||v.some(x=>String(x??'').toLowerCase().includes(q))}function visible(p){return document.getElementById('showArchived').checked||!p.archived}function table(h,r){return `<div class="wrap"><table><thead><tr>${h.map(x=>`<th class="${x[1]||''}">${x[0]}</th>`).join('')}</tr></thead><tbody>${r.join('')||`<tr><td colspan="${h.length}" class="empty">Keine Einträge gefunden.</td></tr>`}</tbody></table></div>`}
function render(){const t=document.getElementById('title'),s=document.getElementById('subtitle'),a=document.getElementById('addLink'),c=document.getElementById('content');a.style.display='inline-block';
 if(current==='projects'){t.textContent='Projekte';s.textContent='Projektübersicht unabhängig von der Belegart';a.textContent='+ Projekt';a.href='/projects/new';const rows=projects.filter(p=>visible(p)&&match(p.project_number,p.name,p.customer_name,p.property_name,p.category,p.status)).map(p=>`<tr${p.archived?' style="opacity:.6"':''}><td><b>${esc(p.project_number)}</b>${p.archived?' <span class="pill">Archiviert</span>':''}</td><td><a class="link" href="/projects/${p.id}">${esc(p.name)}</a></td><td>${esc(p.customer_name)}</td><td>${esc(p.property_name||'—')}</td><td>${esc(p.category||'—')}</td><td><span class="pill">${esc(p.status)}</span></td><td class="number">${p.quote_count}</td><td class="number">${p.document_count||0}</td><td><a class="link" href="/projects/${p.id}">Projektmappe</a> · <a class="link" href="/quotes/new?project_id=${p.id}">+ Angebot</a>${p.quote_count?` · <a class="link" href="#quotes" onclick="setTimeout(()=>filterProject('${esc(p.project_number)}'),0)">Angebote</a>`:''} · <a class="link" href="#" onclick="duplicateProject(${p.id},false);return false">Kopieren</a> · <a class="link" href="#" onclick="duplicateProject(${p.id},true);return false">Als Mustervorgang speichern</a> · <a class="link" href="#" onclick="toggleArchived(${p.id},${!p.archived});return false">${p.archived?'Entarchivieren':'Archivieren'}</a> · <a class="link" href="#" onclick="deleteProjectRow(${p.id});return false">Löschen</a></td></tr>`);c.innerHTML=table([['Projekt'],['Bezeichnung'],['Kunde'],['Objekt'],['Kategorie'],['Status'],['Angebote','number'],['Dateien','number'],['']],rows)}
 else if(current==='quotes'){t.textContent='Angebote';s.textContent='Alle Angebote projektübergreifend';a.textContent='+ Angebot';a.href='/quotes/new';const rows=quotes.filter(q=>match(q.quote_number,q.title,q.project_number,q.project_name,q.customer_name,q.status)).map(q=>`<tr><td><b>${esc(q.quote_number)}</b></td><td><a class="link" href="/quotes/${q.id}/edit">${esc(q.title)}</a></td><td>${esc(q.project_number)}<div class="muted small">${esc(q.project_name)}</div></td><td>${esc(q.customer_name)}</td><td><span class="pill">${esc(q.status)}</span></td><td class="number">${money(q.net_total)}</td><td class="number">${money(q.gross_total)}</td><td><a class="link" href="/quotes/${q.id}/edit">Öffnen</a></td></tr>`);c.innerHTML=table([['Angebot'],['Bezeichnung'],['Projekt'],['Kunde'],['Status'],['Netto','number'],['Brutto','number'],['']],rows)}
 else if(current==='orders'){t.textContent='Aufträge & Auftragsbestätigungen';s.textContent='Alle beauftragten Angebote projektübergreifend';a.style.display='none';const rows=orders.filter(o=>match(o.order_number,o.title,o.project_number,o.project_name,o.customer_name,o.status)).map(o=>`<tr><td><b>${esc(o.order_number)}</b></td><td><a class="link" href="/orders/${o.id}">${esc(o.title)}</a></td><td>${esc(o.project_number)}<div class="muted small">${esc(o.project_name)}</div></td><td>${esc(o.customer_name)}</td><td>${new Date(o.order_date+'T00:00:00').toLocaleDateString('de-DE')}</td><td><span class="pill">${esc(o.status)}</span></td><td class="number">${money(o.net_total)}</td><td class="number">${money(o.gross_total)}</td><td><a class="link" href="/orders/${o.id}">Öffnen</a></td></tr>`);c.innerHTML=table([['Auftrag'],['Bezeichnung'],['Projekt'],['Kunde'],['Datum'],['Status'],['Netto','number'],['Brutto','number'],['']],rows)}
 else if(current==='inquiries'){t.textContent='Anfragen';s.textContent='Vertriebsanfragen und Vorstufe zum Projekt';a.textContent='+ Anfrage';a.href='/inquiries';const rows=inquiries.filter(i=>match(i.inquiry_number,i.title,i.customer_name,i.property_name,i.status,i.priority)).map(i=>`<tr><td><b>${esc(i.inquiry_number)}</b></td><td>${esc(i.title)}</td><td>${esc(i.customer_name)}</td><td>${esc(i.property_name||'—')}</td><td><span class="pill">${esc(i.status)}</span></td><td>${esc(i.priority)}</td><td><a class="link" href="/inquiries">Pipeline öffnen</a></td></tr>`);c.innerHTML=table([['Anfrage'],['Bezeichnung'],['Kunde'],['Objekt'],['Status'],['Priorität'],['']],rows)}
 else if(current==='templates'){t.textContent='Mustervorgänge';s.textContent='Vorlagen für wiederkehrende Vorgänge – erscheinen nicht in der normalen Projektübersicht';a.style.display='none';const rows=templates.filter(p=>visible(p)&&match(p.project_number,p.name,p.customer_name,p.property_name,p.category)).map(p=>`<tr${p.archived?' style="opacity:.6"':''}><td><b>${esc(p.project_number)}</b>${p.archived?' <span class="pill">Archiviert</span>':''}</td><td>${esc(p.name)}</td><td>${esc(p.customer_name)}</td><td>${esc(p.category||'—')}</td><td class="number">${p.quote_count}</td><td><a class="link" href="/projects/${p.id}">Ansehen</a> · <a class="link" href="#" onclick="duplicateProject(${p.id},false);return false">Neuen Vorgang erstellen</a> · <a class="link" href="#" onclick="toggleArchived(${p.id},${!p.archived});return false">${p.archived?'Entarchivieren':'Archivieren'}</a> · <a class="link" href="#" onclick="deleteProjectRow(${p.id});return false">Löschen</a></td></tr>`);c.innerHTML=templates.length||document.getElementById('search').value?table([['Muster'],['Bezeichnung'],['Ursprünglicher Kunde'],['Kategorie'],['Angebote','number'],['']],rows):`<div class="placeholder"><h2>Noch keine Mustervorgänge</h2><p class="muted">Bei einem beliebigen Projekt in der normalen Projektübersicht auf "Als Mustervorgang speichern" klicken, um es hier als wiederverwendbare Vorlage abzulegen.</p></div>`}
}
function filterProject(n){showView('quotes',false);document.getElementById('search').value=n;render()}
async function duplicateProject(id,asTemplate){
  if(!confirm(asTemplate?'Dieses Projekt als Mustervorgang speichern? Angebot inkl. Positionen und Kalkulation wird dabei kopiert.':'Dieses Projekt kopieren? Ein neues Projekt mit Kopie des Angebots (Positionen, Kalkulation) wird angelegt.'))return;
  try{
    const result=await api(`/api/projects/${id}/duplicate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({as_template:asTemplate})});
    location.href='/projects/'+result.id;
  }catch(e){ alert('Fehler: '+e.message) }
}
async function toggleArchived(id,archive){
  try{
    await api(`/api/projects/${id}/${archive?'archive':'unarchive'}`,{method:'POST'});
    await load();
  }catch(e){ alert('Fehler: '+e.message) }
}
async function deleteProjectRow(id){
  if(!confirm('Dieses Projekt endgültig löschen? Das kann nicht rückgängig gemacht werden.'))return;
  try{
    await api(`/api/projects/${id}`,{method:'DELETE'});
    await load();
  }catch(e){ alert('Fehler: '+e.message) }
}
async function load(){[projects,quotes,orders,inquiries,templates]=await Promise.all([api('/api/projects?include_archived=true'),api('/api/quotes'),api('/api/orders'),api('/api/inquiries'),api('/api/project-templates?include_archived=true')]);document.getElementById('nProjects').textContent=projects.filter(visible).length;document.getElementById('nQuotes').textContent=quotes.length;document.getElementById('nOrders').textContent=orders.length;document.getElementById('nInquiries').textContent=inquiries.length;document.getElementById('nTemplates').textContent=templates.filter(visible).length;showView(fromHash(),false)}window.addEventListener('hashchange',()=>showView(fromHash(),false));load().catch(e=>document.getElementById('content').innerHTML=`<div class="empty">Fehler: ${esc(e.message)}</div>`);
</script></body></html>

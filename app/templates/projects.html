<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DACHKONZEPTE ERP – Projekte</title>
<script>(function(){try{var t=localStorage.getItem('erp_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--accent:{{ get_theme().accent_color }};--bg:#f4f6f5;--card:#fff;--ink:#182420;--muted:#5c6f68;--line:#dde5e1;--field-border:#b9c4bd;--field-border-hover:#8fa098;--soft:#eef5f3;--sidebar-bg:#fbfdfc;--sidebar-text:#223028;--sidebar-text-dim:rgba(34,48,40,.7);--sidebar-border:#e2e8e5;--sidebar-hover:color-mix(in srgb,var(--accent) 8%,var(--sidebar-bg));--sidebar-active-bg:color-mix(in srgb,var(--accent) 12%,var(--sidebar-bg));--sidebar-active-text:var(--accent);--sidebar-active-border:var(--accent);color:var(--ink)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121816;--card:#1a2220;--ink:#e7ece8;--muted:#94a49c;--line:#2b3532;--field-border:#3a4642;--field-border-hover:#4d5b56;--soft:#1e2b26;--sidebar-bg:#0e1513;--sidebar-text:#e7ece8;--sidebar-text-dim:rgba(231,236,232,.68);--sidebar-border:rgba(255,255,255,.09);--sidebar-hover:color-mix(in srgb,var(--accent) 16%,var(--sidebar-bg));--sidebar-active-bg:color-mix(in srgb,var(--accent) 22%,var(--sidebar-bg))}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}main{max-width:1500px;margin:0;padding:20px}.card{background:var(--card);border:1px solid var(--line);padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.head h1{font-size:22px;margin:0;color:var(--ink)}
.toolbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
input,select{padding:9px 11px;border:1px solid var(--field-border);background:var(--card);color:var(--ink);font:inherit}
input:hover,select:hover{border-color:var(--field-border-hover)}input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field select,.field input{min-width:180px}
.search{min-width:260px}
.check{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--ink);padding-bottom:9px}
.check input{width:auto}
.view-toggle{display:flex;border:1px solid var(--field-border);margin-left:auto}
.view-toggle button{border:0;background:var(--card);color:var(--ink);padding:9px 16px;font:inherit;font-weight:650;cursor:pointer}
.view-toggle button+button{border-left:1px solid var(--field-border)}
.view-toggle button.active{background:var(--accent);color:#fff}
.add{background:var(--accent);color:#fff;text-decoration:none;padding:10px 14px;font-weight:650;border:1px solid var(--accent)}.add:hover{background:color-mix(in srgb,var(--accent) 85%,black)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--card);font-weight:700}tbody tr:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}.wrap{overflow:auto;max-height:70vh}
.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-block;padding:2px 8px;background:var(--soft);border:1px solid var(--line);font-size:10.5px}.link{color:var(--accent);font-weight:650;text-decoration:none}.number{text-align:right}.empty{padding:45px;text-align:center;color:var(--muted)}.placeholder{border:1px dashed var(--field-border);background:var(--soft);padding:45px;text-align:center}.placeholder h2{margin-top:0;color:var(--ink)}
.archived-row{opacity:.6}
.menu-cell{position:relative;width:36px}
.menu-btn{border:1px solid transparent;background:transparent;color:var(--ink);font-size:16px;line-height:1;padding:6px 9px;cursor:pointer}
.menu-btn:hover{background:var(--soft);border-color:var(--line)}
.menu{position:absolute;right:0;top:calc(100% + 2px);background:var(--card);border:1px solid var(--line);min-width:210px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.menu a,.menu button.menu-item{display:block;width:100%;text-align:left;padding:9px 13px;background:none;border:0;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-decoration:none}
.menu a:hover,.menu button.menu-item:hover{background:var(--soft)}
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kanban-col{background:var(--soft);border:1px solid var(--line);min-width:260px;max-width:280px;flex:0 0 260px;display:flex;flex-direction:column;max-height:75vh}
.kanban-col-head{padding:10px 12px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.kanban-col-body{padding:8px;overflow-y:auto;flex:1;min-height:70px}
.kanban-col-body.drop-target{background:color-mix(in srgb,var(--accent) 12%,transparent);outline:2px dashed var(--accent);outline-offset:-2px}
.kanban-card{background:var(--card);border:1px solid var(--line);padding:10px 11px;margin-bottom:8px;cursor:grab}
.kanban-card:hover{border-color:var(--field-border-hover)}
.kanban-card.dragging{opacity:.35}
.kanban-card-number{font-weight:700;font-size:12px}
.kanban-card-title{font-weight:650;margin:2px 0}
.kanban-empty{padding:10px;text-align:center}
@media(max-width:850px){.head{flex-direction:column;align-items:flex-start}.toolbar{flex-direction:column;align-items:stretch}.field select,.field input,.search{min-width:0;width:100%}.view-toggle{margin-left:0}}
</style></head><body>
<div class="app-layout">
{% include "_sidebar.html" %}
<div class="app-content">
{% include "_topbar.html" %}
<main><section class="card">
<div class="head"><div><h1>Projekte</h1><div id="subtitle" class="muted small"></div></div><a id="addLink" class="add" href="/projects/new">+ Projekt</a></div>
<div class="toolbar">
 <div class="field"><label>Suche</label><input id="search" class="search" placeholder="Projektnr., Bezeichnung, Kunde …" oninput="render()"></div>
 <div class="field"><label>Kategorie</label><select id="categoryFilter" onchange="render()"><option value="">Alle Kategorien</option></select></div>
 <div class="field"><label>Angebot / Auftrag</label><select id="statusFilter" onchange="render()">
   <option value="">Alle</option>
   <option value="entwurf">Angebot: Entwurf</option>
   <option value="versendet">Angebot: Versendet</option>
   <option value="auftrag">Auftrag vorhanden</option>
   <option value="keins">Ohne Angebot</option>
 </select></div>
 <label class="check"><input type="checkbox" id="onlyTemplates" onchange="onTemplatesToggle()"> Nur Mustervorgänge</label>
 <label class="check"><input type="checkbox" id="showArchived" onchange="render()"> Archivierte anzeigen</label>
 <div class="view-toggle"><button id="viewListBtn" onclick="setView('list')">Liste</button><button id="viewKanbanBtn" onclick="setView('kanban')">Kanban</button></div>
</div>
<div id="content"></div>
</section></main>
</div>
</div>
<script>
let projects=[],templates=[],quotes=[],orders=[],columns=[];
let onlyTemplates=false;
let viewMode=(localStorage.getItem('erp_project_view')==='kanban')?'kanban':'list';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(u,opts){const r=await fetch(u,opts);if(!r.ok)throw Error((await r.json().catch(()=>({detail:r.statusText}))).detail||r.statusText);return r.json()}

function currentDataset(){return onlyTemplates?templates:projects}
function visible(p){return document.getElementById('showArchived').checked||!p.archived}
function match(p){const q=document.getElementById('search').value.trim().toLowerCase();if(!q)return true;return [p.project_number,p.name,p.customer_name,p.property_name,p.category,p.status].some(x=>String(x??'').toLowerCase().includes(q))}
function matchesCategory(p){const c=document.getElementById('categoryFilter').value;return !c||p.category===c}
function projectQuoteInfo(id){
  const qs=quotes.filter(q=>q.project_id===id);
  return {hasDraft:qs.some(q=>q.status==='entwurf'),hasSent:qs.some(q=>q.status==='versendet'),hasOrder:orders.some(o=>o.project_id===id),hasAny:qs.length>0};
}
function matchesStatusFilter(p){
  const f=document.getElementById('statusFilter').value;
  if(!f)return true;
  const info=projectQuoteInfo(p.id);
  if(f==='entwurf')return info.hasDraft;
  if(f==='versendet')return info.hasSent;
  if(f==='auftrag')return info.hasOrder;
  if(f==='keins')return !info.hasAny;
  return true;
}
function filteredRows(){return currentDataset().filter(p=>visible(p)&&match(p)&&matchesCategory(p)&&matchesStatusFilter(p))}

function populateCategoryFilter(){
  const cats=[...new Set([...projects,...templates].map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  const sel=document.getElementById('categoryFilter');const current=sel.value;
  sel.innerHTML='<option value="">Alle Kategorien</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value=current;
}

function setView(v){viewMode=v;localStorage.setItem('erp_project_view',v);applyViewButtons();render()}
function applyViewButtons(){document.getElementById('viewListBtn').classList.toggle('active',viewMode==='list');document.getElementById('viewKanbanBtn').classList.toggle('active',viewMode==='kanban')}
function onTemplatesToggle(){onlyTemplates=document.getElementById('onlyTemplates').checked;render()}

function render(){
  document.getElementById('addLink').style.display=onlyTemplates?'none':'inline-block';
  document.getElementById('subtitle').textContent=onlyTemplates?'Vorlagen für wiederkehrende Vorgänge – erscheinen nicht in der normalen Projektübersicht':'Projektübersicht mit Kanban-Pipeline';
  const rows=filteredRows();
  const content=document.getElementById('content');
  if(onlyTemplates&&!templates.length&&!document.getElementById('search').value.trim()){
    content.innerHTML='<div class="placeholder"><h2>Noch keine Mustervorgänge</h2><p class="muted">Bei einem beliebigen Projekt über das Kontextmenü (⋮) "Als Mustervorgang speichern" wählen, um es hier als wiederverwendbare Vorlage abzulegen.</p></div>';
    return;
  }
  content.innerHTML=viewMode==='kanban'?renderKanban(rows):renderList(rows);
  if(viewMode==='kanban')wireKanbanDrag();
}

function menuItemsFor(p){
  if(onlyTemplates){
    return `<a href="/projects/${p.id}">Projektmappe</a>`
      +`<a href="#" onclick="closeAllMenus();duplicateProject(${p.id},false);return false">Neuen Vorgang erstellen</a>`
      +`<a href="#" onclick="closeAllMenus();toggleArchived(${p.id},${!p.archived});return false">${p.archived?'Entarchivieren':'Archivieren'}</a>`
      +`<a href="#" onclick="closeAllMenus();deleteProjectRow(${p.id});return false">Löschen</a>`;
  }
  return `<a href="/projects/${p.id}">Projektmappe</a>`
    +`<a href="/quotes/new?project_id=${p.id}">+ Angebot</a>`
    +(p.quote_count?`<a href="/projects/${p.id}#sec-quotes">Angebote</a>`:'')
    +`<a href="#" onclick="closeAllMenus();duplicateProject(${p.id},false);return false">Kopieren</a>`
    +`<a href="#" onclick="closeAllMenus();duplicateProject(${p.id},true);return false">Als Mustervorgang speichern</a>`
    +`<a href="#" onclick="closeAllMenus();toggleArchived(${p.id},${!p.archived});return false">${p.archived?'Entarchivieren':'Archivieren'}</a>`
    +`<a href="#" onclick="closeAllMenus();deleteProjectRow(${p.id});return false">Löschen</a>`;
}

function renderList(rows){
  const trs=rows.map(p=>`<tr onclick="location.href='/projects/${p.id}'" style="cursor:pointer"${p.archived?' class="archived-row"':''}>`
    +`<td><b>${esc(p.project_number)}</b>${p.archived?' <span class="pill">Archiviert</span>':''}</td>`
    +`<td>${esc(p.name)}</td>`
    +`<td>${esc(p.customer_name)}</td>`
    +`<td>${esc(p.property_name||'—')}</td>`
    +`<td>${esc(p.category||'—')}</td>`
    +`<td><span class="pill">${esc(p.status)}</span></td>`
    +`<td class="number">${p.quote_count}</td>`
    +`<td class="number">${p.document_count||0}</td>`
    +`<td class="menu-cell" onclick="event.stopPropagation()"><button class="menu-btn" onclick="toggleMenu(event,${p.id})" aria-label="Aktionen">⋮</button><div class="menu" id="menu-${p.id}" hidden>${menuItemsFor(p)}</div></td>`
    +`</tr>`).join('');
  return `<div class="wrap"><table><thead><tr><th>Projekt</th><th>Bezeichnung</th><th>Kunde</th><th>Objekt</th><th>Kategorie</th><th>Status</th><th class="number">Angebote</th><th class="number">Dateien</th><th></th></tr></thead><tbody>${trs||'<tr><td colspan="9" class="empty">Keine Einträge gefunden.</td></tr>'}</tbody></table></div>`;
}

function cardHtml(p){
  return `<div class="kanban-card" draggable="true" data-project-id="${p.id}" onclick="location.href='/projects/${p.id}'">`
    +`<div class="kanban-card-number">${esc(p.project_number)}${p.archived?' <span class="pill">Archiviert</span>':''}</div>`
    +`<div class="kanban-card-title">${esc(p.name)}</div>`
    +`<div class="muted small">${esc(p.customer_name)}${p.property_name?' · '+esc(p.property_name):''}</div>`
    +`<div class="pill" style="margin-top:6px">${esc(p.status)}</div>`
    +`</div>`;
}
function renderKanban(rows){
  if(!columns.length)return '<div class="empty">Keine Pipeline-Spalten konfiguriert. Unter Einstellungen → Projekte → Projekt-Pipeline anlegen.</div>';
  const byColumn={};
  columns.forEach(c=>byColumn[c.id]=[]);
  rows.forEach(p=>{if(!byColumn[p.pipeline_column_id])byColumn[p.pipeline_column_id]=[];byColumn[p.pipeline_column_id].push(p)});
  return `<div class="kanban">${columns.map(c=>`<div class="kanban-col"><div class="kanban-col-head"><span>${esc(c.label)}</span><span class="pill">${(byColumn[c.id]||[]).length}</span></div><div class="kanban-col-body" data-column-id="${c.id}">${(byColumn[c.id]||[]).map(cardHtml).join('')||'<div class="muted small kanban-empty">—</div>'}</div></div>`).join('')}</div>`;
}
function wireKanbanDrag(){
  document.querySelectorAll('.kanban-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',card.dataset.projectId);e.dataTransfer.effectAllowed='move';card.classList.add('dragging')});
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  });
  document.querySelectorAll('.kanban-col-body').forEach(zone=>{
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drop-target')});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drop-target'));
    zone.addEventListener('drop',async e=>{
      e.preventDefault();zone.classList.remove('drop-target');
      const projectId=Number(e.dataTransfer.getData('text/plain'));
      const columnId=Number(zone.dataset.columnId);
      await moveProjectColumn(projectId,columnId);
    });
  });
}
async function moveProjectColumn(projectId,columnId){
  const project=[...projects,...templates].find(p=>p.id===projectId);
  if(!project||project.pipeline_column_id===columnId)return;
  const previous=project.pipeline_column_id;
  project.pipeline_column_id=columnId;
  render();
  try{
    await api(`/api/projects/${projectId}/pipeline-column`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({pipeline_column_id:columnId})});
  }catch(e){
    project.pipeline_column_id=previous;
    render();
    alert('Fehler beim Verschieben: '+e.message);
  }
}

let openMenuId=null;
function toggleMenu(e,id){
  e.stopPropagation();
  const el=document.getElementById('menu-'+id);
  const wasOpen=!el.hidden;
  closeAllMenus();
  if(!wasOpen){el.hidden=false;openMenuId=id}
}
function closeAllMenus(){document.querySelectorAll('.menu').forEach(m=>m.hidden=true);openMenuId=null}
document.addEventListener('click',closeAllMenus);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAllMenus()});

async function duplicateProject(id,asTemplate){
  if(!confirm(asTemplate?'Dieses Projekt als Mustervorgang speichern? Angebot inkl. Positionen und Kalkulation wird dabei kopiert.':'Dieses Projekt kopieren? Ein neues Projekt mit Kopie des Angebots (Positionen, Kalkulation) wird angelegt.'))return;
  try{
    const result=await api(`/api/projects/${id}/duplicate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({as_template:asTemplate})});
    location.href='/projects/'+result.id;
  }catch(e){alert('Fehler: '+e.message)}
}
async function toggleArchived(id,archive){
  try{
    await api(`/api/projects/${id}/${archive?'archive':'unarchive'}`,{method:'POST'});
    await load();
  }catch(e){alert('Fehler: '+e.message)}
}
async function deleteProjectRow(id){
  if(!confirm('Dieses Projekt endgültig löschen? Das kann nicht rückgängig gemacht werden.'))return;
  try{
    await api(`/api/projects/${id}`,{method:'DELETE'});
    await load();
  }catch(e){alert('Fehler: '+e.message)}
}

async function load(){
  [projects,templates,quotes,orders,columns]=await Promise.all([
    api('/api/projects?include_archived=true'),
    api('/api/project-templates?include_archived=true'),
    api('/api/quotes'),
    api('/api/orders'),
    api('/api/project-pipeline-columns'),
  ]);
  populateCategoryFilter();
  applyViewButtons();
  render();
}
load().catch(e=>document.getElementById('content').innerHTML=`<div class="empty">Fehler: ${esc(e.message)}</div>`);
</script></body></html>

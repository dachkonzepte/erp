<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projekt anlegen</title>
<script>(function(){try{var t=localStorage.getItem('erp_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--accent:{{ get_theme().accent_color }};--bg:#f4f6f5;--card:#fff;--ink:#182420;--muted:#5c6f68;--line:#dde5e1;--field-border:#b9c4bd;--field-border-hover:#8fa098;color:var(--ink);background:var(--bg)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121816;--card:#1a2220;--ink:#e7ece8;--muted:#94a49c;--line:#2b3532;--field-border:#3a4642;--field-border-hover:#4d5b56}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.topnav{max-width:900px;margin:24px auto 0;padding:0 22px}.back{color:var(--accent);text-decoration:none;font-weight:700}.wrap{max-width:900px;margin:12px auto 24px;background:var(--card);border:1px solid var(--line);padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}label{display:block;font-size:12px;font-weight:650;margin-bottom:5px;color:var(--muted)}input,select,textarea{width:100%;padding:10px;border:1px solid var(--field-border);background:var(--card);color:var(--ink);font:inherit}input:hover,select:hover,textarea:hover{border-color:var(--field-border-hover)}input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}button{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:11px 16px;font-weight:650;cursor:pointer}button:hover{background:color-mix(in srgb,var(--accent) 85%,black);border-color:color-mix(in srgb,var(--accent) 85%,black)}.muted{color:var(--muted);font-size:12px}h1{color:var(--ink)}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="topnav"><a class="back" href="#" onclick="history.back();return false">← Projekte & Belege</a></div><div class="wrap"><h1>Neues Projekt</h1><p class="muted">Projektmappe mit Kunde, Objekt und Kategorie anlegen. Angebote und Dateien werden anschließend direkt in der Mappe verwaltet.</p><div class="grid"><div class="field"><label>Kunde *</label><select id="customer" onchange="loadProperties()"></select></div><div class="field"><label>Objekt</label><select id="property"></select></div><div class="field" style="grid-column:1/-1"><label>Projektbezeichnung *</label><input id="name"></div><div class="field"><label>Projektkategorie</label><select id="category"></select></div><div class="field"><label>Status</label><select id="status"><option value="anfrage">Anfrage</option><option value="planung">Planung</option><option value="beauftragt">Beauftragt</option><option value="ausfuehrung">Ausführung</option><option value="abgeschlossen">Abgeschlossen</option></select></div><div class="field" style="grid-column:1/-1"><label>Beschreibung</label><textarea id="description" rows="5"></textarea></div></div><button onclick="save()">Projektmappe anlegen</button> <span id="msg" class="muted"></span></div><script>
let customers=[];const api=async(u,o)=>{const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||r.statusText);return d};
async function load(){await api('/api/settings/option-groups').catch(()=>[]);const [cs,cats]=await Promise.all([api('/api/customers'),api('/api/settings/option-groups/project_categories').catch(()=>({options:[]}))]);customers=cs;document.getElementById('customer').innerHTML=customers.map(c=>`<option value="${c.id}">${c.customer_number} · ${c.name}</option>`).join('');document.getElementById('category').innerHTML=(cats.options||[]).filter(x=>x.active).map(x=>`<option value="${x.value}" ${x.is_default?'selected':''}>${x.label}</option>`).join('');let cid=new URLSearchParams(location.search).get('customer_id');if(cid)document.getElementById('customer').value=cid;await loadProperties()}
async function loadProperties(){let id=document.getElementById('customer').value;if(!id)return;let p=await api('/api/properties?customer_id='+id);document.getElementById('property').innerHTML='<option value="">— kein Objekt —</option>'+p.map(x=>`<option value="${x.id}">${x.name} · ${(x.postal_code||'')} ${(x.city||'')}</option>`).join('');let main=p.find(x=>x.name==='Hauptadresse');if(main)document.getElementById('property').value=main.id}
async function save(){try{const d=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:Number(document.getElementById('customer').value),property_id:document.getElementById('property').value?Number(document.getElementById('property').value):null,name:document.getElementById('name').value.trim(),status:document.getElementById('status').value,category:document.getElementById('category').value||null,description:document.getElementById('description').value.trim()||null})});location.href='/projects/'+d.id}catch(e){document.getElementById('msg').textContent='Fehler: '+e.message}}
load()</script></body></html>
